version: "3.8"

services:
  solid-dataspace-manager:
    build:
      context: ../solid-dataspace-manager
    restart: unless-stopped
    environment:
      - REACT_APP_OIDC_ISSUER=https://solidcommunity.net
      - REACT_APP_REDIRECT_URL=http://localhost
      - REACT_APP_FOOTER_LOGOS=/Logo_TMDT.png
      - REACT_APP_VERSION=0.5.0
      - PORT=3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../solid-dataspace-manager:/app:delegated
      - /app/node_modules
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  smart-city-urban-heat-monitoring:
    build:
      context: ../smart-city-urban-heat-monitoring
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../smart-city-urban-heat-monitoring:/app:delegated
      - /app/node_modules
    expose: ["4200"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-smart-city-urban-heat-monitoring

  semantic-data-catalog-backend:
    build:
      context: ../semantic-data-catalog/backend
    restart: unless-stopped
    environment:
      BASE_URI: http://localhost
      CATALOG_NAME: "Semantic Data Catalog"
      CATALOG_DESCRIPTION: "Demonstrator"
      DATABASE_URL: mysql+pymysql://semantic_data_catalog:mNXZqSq4oK53Q7@db:3306/semantic_data_catalog
      RESET_DB: "true"
      RUN_POPULATE: "true"
    command: >
      bash -c "
      alembic upgrade head &&
      python populate.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ../semantic-data-catalog/backend:/app:delegated
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend
    depends_on:
      - db
      - semantic-data-catalog-fuseki

  semantic-data-catalog-frontend:
    build:
      context: ../semantic-data-catalog/frontend
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      REACT_APP_REDIRECT_URL: http://localhost/semantic-data-catalog/
      REACT_APP_FOOTER_LOGOS: /assets/images/Logo_GesundesTal.png,/assets/images/Icon_GesundesTal.png
      REACT_APP_VERSION: "0.7.4"
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../semantic-data-catalog/frontend:/app/frontend:delegated
      - /app/frontend/node_modules
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend
    depends_on:
      - semantic-data-catalog-backend

  db:
    image: mariadb:10.5
    hostname: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 8ED4iwZwPcwKPc
      MYSQL_DATABASE: semantic_data_catalog
      MYSQL_USER: semantic_data_catalog
      MYSQL_PASSWORD: mNXZqSq4oK53Q7
    volumes:
      - semantic_data_catalog_db_data:/var/lib/mysql
    ports:
     - "3306"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-db

  semantic-data-catalog-fuseki:
    image: stain/jena-fuseki
    hostname: fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - semantic_data_catalog_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-fuseki

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    ports:
     - "1883"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - solid-dataspace-manager
      - smart-city-urban-heat-monitoring
      - semantic-data-catalog-frontend
      - node-red

volumes:
  semantic_data_catalog_db_data:
  semantic_data_catalog_fuseki_data:
  nodered-data:

networks:
  solid-dataspace:
    external: true
    name: solid-dataspace
