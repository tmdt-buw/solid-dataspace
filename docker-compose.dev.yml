# Selective development override. Use with docker-compose.yml AND docker-compose.local.yml.
# All other applications continue to use their published images.
services:
  solid-health-app:
    image: node:22-alpine
    working_dir: /app
    command: [sh, /local/health-start.sh]
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      WDS_SOCKET_PORT: '0'
      PUBLIC_URL: /solid-health-app
      WDS_SOCKET_PATH: /solid-health-app/ws
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      BROWSER: none
    volumes:
      - ${HEALTH_SOURCE:-../solid-health-app}:/app
      - health_dependencies:/app/node_modules
      - health_dist:/app/dist
      - npm_cache:/root/.npm
      - ./local:/local:ro
    healthcheck:
      test: [CMD, node, /local/health-ready.cjs]
      interval: 10s
      timeout: 5s
      start_period: 20m
      retries: 6

  local-catalog-package:
    image: ${LOCAL_MANAGER_IMAGE:-son1i/solid-dataspace-manager:latest}
    restart: 'no'
    command: [node, /local/export-catalog.cjs]
    network_mode: none
    volumes:
      - ./local:/local:ro
      - catalog_package:/packages

  city-tours:
    image: node:22-alpine
    working_dir: /app
    command: [sh, /local/tours-start.sh]
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      LOCAL_NPM_PACKAGE_DIR: /packages
    volumes:
      - ${CITY_TOURS_SOURCE:-../solid-tours}:/app
      - tours_dependencies:/app/node_modules
      - tours_dist:/app/dist
      - catalog_package:/packages:ro
      - npm_cache:/root/.npm
      - ./local:/local:ro
    depends_on:
      local-catalog-package:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, /local/tours-ready.cjs]
      interval: 10s
      timeout: 5s
      start_period: 20m
      retries: 6

  solid-dataspace-manager:
    command: [npm, run, start:local-packages]
    environment:
      HOST: 0.0.0.0
      PORT: '3001'
      WDS_SOCKET_PORT: '0'
      BROWSER: none
      LOCAL_PACKAGE_WATCH_DIRS: /solid-health-app/dist;/city-tours/dist
      WATCHPACK_POLLING: 'true'
    volumes:
      - health_dist:/solid-health-app/dist:ro
      - tours_dist:/city-tours/dist:ro
    depends_on:
      solid-health-app:
        condition: service_healthy
      city-tours:
        condition: service_healthy

  solid-data-connection-sync-worker:
    working_dir: /app
    command: [sh, /local/worker-dev.sh]
    environment:
      NODE_ENV: development
    volumes:
      - ${WORKER_SOURCE:-../solid-data-connection-sync-worker}:/app
      - worker_dependencies:/app/node_modules
      - npm_cache:/root/.npm

volumes:
  catalog_package:
  tours_dependencies:
  tours_dist:
  health_dependencies:
  health_dist:
  worker_dependencies:
  npm_cache:
