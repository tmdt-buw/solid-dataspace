services:
  solid-dataspace-manager:
    build:
      context: ../solid-dataspace-manager
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    restart: unless-stopped
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
      NPM_CONFIG_USERCONFIG: /tmp/.npmrc
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      REACT_APP_REDIRECT_URL: http://localhost
      REACT_APP_FOOTER_LOGOS: /Logo_TMDT.png
      REACT_APP_VERSION: 0.5.0
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

      APP_BRANDING_JSON: >-
        {
          "projectName": "Gesundes Tal",
          "logoUrl": "/project-logos/GesundesTal_Logo.png",
          "logoAlt": "Gesundes Tal Logo"
        }

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "smart-city-urban-heat-monitoring",
            "title": "Urban Heat Monitoring",
            "href": "/web/smart-city-urban-heat-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 10,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Solid Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": false,
            "order": 20,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid",
            "issuer": "https://tmdt-solid-community-server.de",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]

    command: sh -c "while [ ! -f /solid-data-manager/dist/package.json ]; do sleep 1; done; cd /app && echo \"@hoelk-f:registry=https://npm.pkg.github.com/\" > $${NPM_CONFIG_USERCONFIG} && echo \"//npm.pkg.github.com/:_authToken=$${NPM_TOKEN}\" >> $${NPM_CONFIG_USERCONFIG} && npm install && npm start"
    volumes:
      - ../solid-dataspace-manager:/app:delegated
      - solid_data_manager_dist:/solid-data-manager/dist
      - semantic_data_catalog_dist:/semantic-data-catalog/dist
      - /app/node_modules
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  solid-data-manager:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PORT=3002
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-data-manager:/app:delegated
      - solid_data_manager_dist:/app/dist
      - /app/node_modules
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-manager

  smart-city-urban-heat-monitoring:
    build:
      context: ../smart-city-urban-heat-monitoring
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../smart-city-urban-heat-monitoring:/app:delegated
      - /app/node_modules
    expose: ["4200"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-smart-city-urban-heat-monitoring

  solid-health-app:
    build:
      context: ../solid-health-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../solid-health-app:/app:delegated
      - /app/node_modules
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-app

  semantic-data-catalog-frontend:
    build:
      context: ../semantic-data-catalog/frontend
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm run start-watch)"
    volumes:
      - ../semantic-data-catalog/frontend:/app/frontend:delegated
      - semantic_data_catalog_dist:/app/frontend/dist
      - /app/frontend/node_modules
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    build:
      context: ../semantic-data-catalog/backend
    restart: unless-stopped
    volumes:
      - ../semantic-data-catalog/backend:/app:delegated
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend

  semantic-data-catalog-fuseki:
    image: stain/jena-fuseki
    hostname: fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - semantic_data_catalog_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-fuseki

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    ports:
      - "1883"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - solid-dataspace-manager
      - solid-data-manager
      - smart-city-urban-heat-monitoring
      - solid-health-app
      - semantic-data-catalog-frontend
      - semantic-data-catalog-backend
      - node-red

volumes:
  semantic_data_catalog_fuseki_data:
  nodered-data:
  solid_data_manager_dist:
  semantic_data_catalog_dist:

networks:
  solid-dataspace:
    external: true
    name: solid-dataspace
