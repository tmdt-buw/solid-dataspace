services:
  solid-dataspace-manager:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
      NPM_CONFIG_USERCONFIG: /tmp/.npmrc
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      REACT_APP_REDIRECT_URL: http://localhost
      REACT_APP_FOOTER_LOGOS: /Logo_TMDT.png
      REACT_APP_VERSION: 0.5.0
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "80"
      APP_PLASMA_URL: ${PLASMA_PUBLIC_URL:-/plasma/modelings}
      APP_DATASPACE_ID: ${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-}}}
      DATASPACE_MANAGER_PACKAGE_SOURCE: ${DATASPACE_MANAGER_PACKAGE_SOURCE:-local}
      APP_SYNC_WORKER_ENABLED: ${SOLID_SYNC_WORKER_ENABLED:-true}
      APP_SYNC_WORKER_API_URL: ${SOLID_SYNC_WORKER_API_URL:-/sync-worker}
      APP_SYNC_WORKER_SERVICE_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      APP_SYNC_WORKER_INTERVAL_MINUTES: "10"
      APP_STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      APP_STATISTICS_ADMIN_WEBIDS_JSON: >-
        ${STATISTICS_ADMIN_WEBIDS_JSON:-["https://solid-community-server.tmdt.info/solidtestpod/profile/card#me"]}
      APP_STATISTICS_WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-https://solid-community-server.tmdt.info/solidserviceworker/profile/card#me}
      APP_STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      APP_STATISTICS_EVENTS_URL: ${STATISTICS_EVENTS_URL:-${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-__unconfigured__}}}/downloads/}
      APP_STATISTICS_ACTIVITY_RESOURCE_PATH: ${STATISTICS_ACTIVITY_RESOURCE_PATH:-statistics/activity/activity.ttl}
      APP_STATISTICS_TIMEZONE: ${STATISTICS_TIMEZONE:-Europe/Berlin}

      APP_BRANDING_JSON: >-
        {
          "projectName": "TMDT",
          "logoUrl": "/project-logos/Logo_TMDT.png",
          "logoAlt": "TMDT Logo",
          "logoWidth": "95px",
          "logoHeight": "auto"
        }

      # Funding logo entries can also set logoWidth, logoHeight, logoMaxWidth, and logoMaxHeight.
      APP_FUNDING_LOGOS_JSON: >-
        [
          
        ]
      APP_FUNDING_GRANT_NUMBER: ""

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "environmental-monitoring",
            "title": "Environmental Monitoring",
            "href": "/web/environmental-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 15,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Solid Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": true,
            "order": 20,
            "linkType": "internal"
          },
          {
            "id": "solid-tours",
            "title": "Solid Tours",
            "href": "/web/solid-tours",
            "section": "applications",
            "iconKey": "tour",
            "visible": ${SOLID_TOURS_VISIBLE:-true},
            "order": 22,
            "linkType": "internal"
          },
          {
            "id": "solid-health-questionnaire",
            "title": "Solid Health Questionnaire",
            "href": "/web/solid-health-questionnaire",
            "section": "applications",
            "iconKey": "questionnaire",
            "visible": ${SOLID_HEALTH_QUESTIONNAIRE_VISIBLE:-true},
            "order": 24,
            "linkType": "internal"
          },
          {
            "id": "solid-chatbot",
            "title": "Solid Chatbot",
            "href": "/web/solid-chatbot",
            "section": "applications",
            "iconKey": "rocketchat",
            "visible": ${SOLID_CHATBOT_VISIBLE:-true},
            "order": 25,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid Server",
            "issuer": "https://solid-community-server.tmdt.info",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community Server",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]

    command: sh -c "cd /app && find /app/node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true && echo \"@hoelk-f:registry=https://npm.pkg.github.com/\" > $${NPM_CONFIG_USERCONFIG} && echo \"//npm.pkg.github.com/:_authToken=$${NPM_TOKEN}\" >> $${NPM_CONFIG_USERCONFIG} && if [ \"$${DATASPACE_MANAGER_PACKAGE_SOURCE}\" = \"local\" ]; then while [ ! -f /solid-data-manager/dist/package.json ] || [ ! -f /solid-health-app/dist/package.json ] || [ ! -f /solid-health-questionnaire/dist/package.json ] || [ ! -f /solid-chatbot/dist/package.json ]; do sleep 1; done; npm install --install-links=true --no-save --package-lock=false /solid-data-manager/dist /semantic-data-catalog/dist /solid-health-app/dist /solid-tours/dist /solid-health-questionnaire/dist /solid-chatbot/dist && npm run start:local-packages; else npm install && npm install --no-save --package-lock=false @hoelk-f/solid-data-manager@latest @hoelk-f/semantic-data-catalog@latest @hoelk-f/solid-health-app@latest @hoelk-f/solid-tours@latest @hoelk-f/solid-health-questionnaire@latest @hoelk-f/solid-chatbot@latest && npm start; fi"
    volumes:
      - ../solid-dataspace-manager:/app:delegated
      - solid_data_manager_dist:/solid-data-manager/dist
      - semantic_data_catalog_dist:/semantic-data-catalog/dist
      - solid_health_app_dist:/solid-health-app/dist
      - solid_tours_dist:/solid-tours/dist
      - solid_health_questionnaire_dist:/solid-health-questionnaire/dist
      - solid_chatbot_dist:/solid-chatbot/dist
      - /app/node_modules
    depends_on:
      solid-data-manager:
        condition: service_started
      semantic-data-catalog-frontend:
        condition: service_healthy
      solid-health-app:
        condition: service_started
      solid-tours:
        condition: service_healthy
      solid-health-questionnaire:
        condition: service_healthy
      solid-chatbot:
        condition: service_started
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  solid-data-manager:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PORT=3002
      - PUBLIC_URL=/solid-data-manager
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-data-manager:/app:delegated
      - solid_data_manager_dist:/app/dist
      - /app/node_modules
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-manager

  environmental-monitoring:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../environmental-monitoring:/app:delegated
      - /app/node_modules
    expose: ["5173"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-environmental-monitoring

  solid-health-app:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - PUBLIC_URL=/solid-health-app
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-health-app:/app:delegated
      - solid_health_app_dist:/app/dist
      - /app/node_modules
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-app

  solid-tours:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - NPM_TOKEN=${NPM_TOKEN}
      - NPM_CONFIG_USERCONFIG=/tmp/.npmrc
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "rm -f /tmp/solid-tours-dist.ready && echo \"@hoelk-f:registry=https://npm.pkg.github.com/\" > $${NPM_CONFIG_USERCONFIG} && echo \"//npm.pkg.github.com/:_authToken=$${NPM_TOKEN}\" >> $${NPM_CONFIG_USERCONFIG} && (node -e \"const p=require('/app/node_modules/@hoelk-f/semantic-data-catalog/package.json'); const expected=require('/semantic-data-catalog/dist/package.json').version; if (p.version !== expected || !p.exports || !p.exports['./catalog-api']) process.exit(1); require.resolve('@hoelk-f/semantic-data-catalog/catalog-api');\" || npm install --install-links=true --no-save --package-lock=false /semantic-data-catalog/dist) && node -e \"const p=require('/app/node_modules/@hoelk-f/semantic-data-catalog/package.json'); const expected=require('/semantic-data-catalog/dist/package.json').version; if (p.version !== expected || !p.exports || !p.exports['./catalog-api']) process.exit(1); require.resolve('@hoelk-f/semantic-data-catalog/catalog-api');\" && npm run build:lib && node -e \"const p=require('/app/dist/package.json'); const expected=require('/app/package.json').version; if (p.name !== '@hoelk-f/solid-tours' || p.version !== expected || !p.exports || !p.exports['./embed'] || !p.exports['./embed.css']) process.exit(1);\" && test -s /app/dist/index.js && test -s /app/dist/index.cjs && test -s /app/dist/embed.css && touch /tmp/solid-tours-dist.ready && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-tours:/app:delegated
      - semantic_data_catalog_dist:/semantic-data-catalog/dist
      - solid_tours_dist:/app/dist
      - /app/node_modules
    depends_on:
      semantic-data-catalog-frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/solid-tours-dist.ready &&
          node -e "const p=require('/app/dist/package.json'); const expected=require('/app/package.json').version; if (p.name !== '@hoelk-f/solid-tours' || p.version !== expected || !p.exports || !p.exports['./embed'] || !p.exports['./embed.css']) process.exit(1);" &&
          test -s /app/dist/index.js &&
          test -s /app/dist/index.cjs &&
          test -s /app/dist/embed.css
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 5s
    expose: ["3006"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-tours

  solid-health-questionnaire:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "rm -f /tmp/solid-health-questionnaire-dist.ready && npm install && npm run build:lib && node -e \"const p=require('/app/dist/package.json'); const expected=require('/app/package.json').version; if (p.name !== '@hoelk-f/solid-health-questionnaire' || p.version !== expected || !p.exports || !p.exports['./embed'] || !p.exports['./embed.css']) process.exit(1);\" && test -s /app/dist/index.js && test -s /app/dist/index.cjs && test -s /app/dist/embed.css && touch /tmp/solid-health-questionnaire-dist.ready && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-health-questionnaire:/app:delegated
      - solid_health_questionnaire_dist:/app/dist
      - /app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/solid-health-questionnaire-dist.ready &&
          node -e "const p=require('/app/dist/package.json'); const expected=require('/app/package.json').version; if (p.name !== '@hoelk-f/solid-health-questionnaire' || p.version !== expected || !p.exports || !p.exports['./embed'] || !p.exports['./embed.css']) process.exit(1);" &&
          test -s /app/dist/index.js &&
          test -s /app/dist/index.cjs &&
          test -s /app/dist/embed.css
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 5s
    expose: ["3007"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-questionnaire

  solid-chatbot:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PUBLIC_URL=/solid-chatbot
      - REACT_APP_CHAINLIT_URL=/chainlit/
      - REACT_APP_OIDC_ISSUER=${SOLID_CHATBOT_OIDC_ISSUER:-https://solid-community-server.tmdt.info}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm run start-watch)"
    volumes:
      - ../solid-chatbot/frontend:/app:delegated
      - solid_chatbot_dist:/app/dist
      - /app/node_modules
    expose: ["3005"]
    depends_on:
      - solid-chatbot-backend
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot

  solid-chatbot-backend:
    build: ../solid-chatbot/backend
    restart: unless-stopped
    env_file:
      - ../solid-chatbot/.env
    environment:
      CHAINLIT_DISABLE_TELEMETRY: "true"
      QDRANT_URL: http://solid-chatbot-qdrant:6333
      OLLAMA_URL: http://solid-chatbot-ollama:11434
    volumes:
      - ../solid-chatbot/backend:/app:delegated
    expose: ["8001"]
    depends_on:
      solid-chatbot-qdrant:
        condition: service_started
      solid-chatbot-ollama:
        condition: service_started
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-backend

  solid-chatbot-ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_ollama_data:/root/.ollama
    expose: ["11434"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-ollama

  solid-chatbot-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_qdrant_data:/qdrant/storage
    expose: ["6333"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-qdrant

  semantic-data-catalog-frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solid-community-server.tmdt.info
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      STATISTICS_EVENTS_URL: ${STATISTICS_EVENTS_URL:-${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-__unconfigured__}}}/downloads/}
      STATISTICS_REGISTRY_CONTEXT: ${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-}}}
    command: sh -c "rm -f /tmp/semantic-data-catalog-dist.ready && npm install && npm run build:lib && node -e \"const p=require('/app/frontend/dist/package.json'); const expected=require('/app/frontend/package.json').version; if (p.name !== '@hoelk-f/semantic-data-catalog' || p.version !== expected || !p.exports || !p.exports['./catalog-api']) process.exit(1);\" && test -s /app/frontend/dist/catalog-api/index.js && test -s /app/frontend/dist/catalog-api/index.cjs && test -s /app/frontend/dist/embed/index.js && test -s /app/frontend/dist/embed/index.cjs && test -s /app/frontend/dist/embed/embed.css && touch /tmp/semantic-data-catalog-dist.ready && (npm run build:lib:watch & npm run start-watch)"
    volumes:
      - ../semantic-data-catalog/frontend:/app/frontend:delegated
      - semantic_data_catalog_dist:/app/frontend/dist
      - /app/frontend/node_modules
    expose: ["5000"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/semantic-data-catalog-dist.ready &&
          node -e "const p=require('/app/frontend/dist/package.json'); const expected=require('/app/frontend/package.json').version; if (p.name !== '@hoelk-f/semantic-data-catalog' || p.version !== expected || !p.exports || !p.exports['./catalog-api']) process.exit(1);" &&
          test -s /app/frontend/dist/catalog-api/index.js &&
          test -s /app/frontend/dist/catalog-api/index.cjs &&
          test -s /app/frontend/dist/embed/index.js &&
          test -s /app/frontend/dist/embed/index.cjs &&
          test -s /app/frontend/dist/embed/embed.css
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 5s
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    build:
      context: ../semantic-data-catalog/backend
    restart: unless-stopped
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
    environment:
      CATALOG_DATASPACE_ID: ${DATASPACE_ID:-}
      CATALOG_REGISTRY_URL: ${CATALOG_REGISTRY_URL:-https://solid-community-server.tmdt.info/semanticdatacatalog/public/${DATASPACE_ID:-__unconfigured__}/}
      CATALOG_FUSEKI_URL: http://semantic-data-catalog-fuseki:3030/catalog
      CATALOG_INDEX_INTERVAL_SECONDS: ${CATALOG_INDEX_INTERVAL_SECONDS:-300}
      CATALOG_INDEX_MAX_AGE_SECONDS: ${CATALOG_INDEX_MAX_AGE_SECONDS:-900}
      CATALOG_SERVICE_WEBID: ${CATALOG_SERVICE_WEBID:-https://solid-community-server.tmdt.info/solidservice/profile/card#me}
      CATALOG_SERVICE_OIDC_ISSUER: ${CATALOG_SERVICE_OIDC_ISSUER:-https://solid-community-server.tmdt.info}
      CATALOG_SERVICE_CLIENT_ID: ${CATALOG_SERVICE_CLIENT_ID:-}
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET:-}
      CATALOG_SERVICE_TOKEN_URL: ${CATALOG_SERVICE_TOKEN_URL:-}
    volumes:
      - ../semantic-data-catalog/backend:/app:delegated
    expose: ["8000"]
    networks:
      catalog-search: {}
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend


  semantic-data-catalog-indexer:
    build: ../semantic-data-catalog/backend
    command: ["python", "-m", "semantic_indexer"]
    restart: unless-stopped
    environment:
      CATALOG_DATASPACE_ID: ${DATASPACE_ID:-}
      CATALOG_REGISTRY_URL: ${CATALOG_REGISTRY_URL:-https://solid-community-server.tmdt.info/semanticdatacatalog/public/${DATASPACE_ID:-__unconfigured__}/}
      CATALOG_FUSEKI_URL: http://semantic-data-catalog-fuseki:3030/catalog
      CATALOG_INDEX_INTERVAL_SECONDS: ${CATALOG_INDEX_INTERVAL_SECONDS:-300}
      CATALOG_INDEX_MAX_AGE_SECONDS: ${CATALOG_INDEX_MAX_AGE_SECONDS:-900}
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
    networks:
      - solid-dataspace
      - catalog-search

  semantic-data-catalog-fuseki:
    build: ../semantic-data-catalog/fuseki
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - semantic_search_data:/fuseki/databases
    networks:
      - catalog-search

  solid-data-connection-sync-worker:
    build:
      context: ../solid-data-connection-sync-worker
    restart: unless-stopped
    environment:
      PORT: "8080"
      WORKER_DB_PATH: /data/participants.sqlite
      WORKER_DB_SECRET: ${SOLID_SYNC_WORKER_DB_SECRET:-}
      WORKER_SYNC_TICK_SECONDS: ${SOLID_SYNC_WORKER_TICK_SECONDS:-600}
      WORKER_REQUEST_TIMEOUT_MS: ${SOLID_SYNC_WORKER_REQUEST_TIMEOUT_MS:-20000}
      WORKER_AUTH_MODE: service
      WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      WORKER_OIDC_ISSUER: ${SOLID_SYNC_WORKER_OIDC_ISSUER:-}
      WORKER_CLIENT_ID: ${SOLID_SYNC_WORKER_CLIENT_ID:-}
      WORKER_CLIENT_SECRET: ${SOLID_SYNC_WORKER_CLIENT_SECRET:-}
      WORKER_ALLOWED_ORIGINS: ${SOLID_SYNC_WORKER_ALLOWED_ORIGINS:-}
      ENVIRONMENTAL_SCENARIO_ENABLED: ${ENVIRONMENTAL_SCENARIO_ENABLED:-true}
      ENVIRONMENTAL_SCENARIO_POLL_SECONDS: ${ENVIRONMENTAL_SCENARIO_POLL_SECONDS:-30}
      ENVIRONMENTAL_SCENARIO_REGISTRIES_JSON: >-
        ${ENVIRONMENTAL_SCENARIO_REGISTRIES_JSON:-[]}
      ENVIRONMENTAL_SCENARIO_MIN_DONORS_PER_ROUTE: ${ENVIRONMENTAL_SCENARIO_MIN_DONORS_PER_ROUTE:-1}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRIES_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRIES_PER_POLL:-8}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_ENTRIES_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_ENTRIES_PER_POLL:-64}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_MEMBERS_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_MEMBERS_PER_POLL:-32}
      ENVIRONMENTAL_SCENARIO_DISCOVERY_TIMEOUT_MS: ${ENVIRONMENTAL_SCENARIO_DISCOVERY_TIMEOUT_MS:-25000}
      ENVIRONMENTAL_SCENARIO_OWNER_WEBID: ${ENVIRONMENTAL_SCENARIO_OWNER_WEBID:-https://solid-community-server.tmdt.info/sscon/profile/card#me}
      ENVIRONMENTAL_SCENARIO_MARKER_URL: ${ENVIRONMENTAL_SCENARIO_MARKER_URL:-https://solid-community-server.tmdt.info/sscon/solid-tours/public/current-run.json}
      ENVIRONMENTAL_SCENARIO_DATA_URL_PREFIX: ${ENVIRONMENTAL_SCENARIO_DATA_URL_PREFIX:-https://solid-community-server.tmdt.info/sscon/solid-tours/runs/}
      ENVIRONMENTAL_SCENARIO_MAX_BYTES: ${ENVIRONMENTAL_SCENARIO_MAX_BYTES:-2097152}
      STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      STATISTICS_EVENT_SOURCES_JSON: >-
        ${STATISTICS_EVENT_SOURCES_JSON:-[{"id":"test","label":"Test","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/test/downloads/"},{"id":"test2","label":"Test 2","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/test2/downloads/"},{"id":"dace","label":"DACE","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/dace/downloads/"},{"id":"stadt-wuppertal","label":"Stadt Wuppertal","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/stadt-wuppertal/downloads/"},{"id":"timberconnect","label":"TimberConnect","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/timberconnect/downloads/"}]}
      STATISTICS_INCLUDE_LEGACY_EVENT_SOURCE: ${STATISTICS_INCLUDE_LEGACY_EVENT_SOURCE:-true}
      STATISTICS_ADMIN_WEBIDS_JSON: >-
        ${STATISTICS_ADMIN_WEBIDS_JSON:-["https://solid-community-server.tmdt.info/solidtestpod/profile/card#me"]}
      STATISTICS_HMAC_SECRET: ${STATISTICS_HMAC_SECRET:-}
      STATISTICS_HMAC_VERSION: ${STATISTICS_HMAC_VERSION:-v1}
      STATISTICS_REGISTRIES_JSON: >-
        ${STATISTICS_REGISTRIES_JSON:-[{"id":"stadt-wuppertal","label":"Gesundes Tal","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/stadt-wuppertal"},{"id":"dace","label":"DACE","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/dace"},{"id":"timberconnect","label":"TimberConnect","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/timberconnect"},{"id":"test","label":"Test","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/test"},{"id":"test2","label":"Test 2","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/test2"}]}
      STATISTICS_REFRESH_INTERVAL_MINUTES: ${STATISTICS_REFRESH_INTERVAL_MINUTES:-15}
      STATISTICS_TIMEZONE: ${STATISTICS_TIMEZONE:-Europe/Berlin}
      STATISTICS_ACTIVITY_RESOURCE_PATH: ${STATISTICS_ACTIVITY_RESOURCE_PATH:-statistics/activity/activity.ttl}
      STATISTICS_RETENTION_MONTHS: ${STATISTICS_RETENTION_MONTHS:-24}
      STATISTICS_RAW_EVENT_RETENTION_DAYS: ${STATISTICS_RAW_EVENT_RETENTION_DAYS:-90}
      STATISTICS_REQUEST_TIMEOUT_MS: ${STATISTICS_REQUEST_TIMEOUT_MS:-20000}
    volumes:
      - ../solid-data-connection-sync-worker:/app:delegated
      - /app/node_modules
      - solid_data_connection_sync_worker_data:/data
    expose: ["8080"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-connection-sync-worker

  plasma-fuseki:
    image: saiye/fuseki:4.7.0
    restart: unless-stopped
    environment:
      - FUSEKI_DATASET_1=sm
      - FUSEKI_DATASET_2=ontologies
      - ADMIN_PASSWORD=plasma
    volumes:
      - plasma_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-plasma-fuseki

  plasma-mariadb-sms:
    image: mariadb:latest
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=plasma-sms
      - MYSQL_ROOT_PASSWORD=plasma
    volumes:
      - plasma_mariadb_sms:/var/lib/mysql
    healthcheck:
      test: bash -c "mariadb -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD -e \"show databases;\""
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    expose: ["3306"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-plasma-mariadb-sms

  plasma-sms:
    image: plasma/sms:${PLASMA_VERSION:-1.8.1}
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ../plasma/deploy/configs:/var/plasma/configs
      - ../plasma/deploy/ontologies:/var/ontologies
    depends_on:
      plasma-mariadb-sms:
        condition: service_healthy
      plasma-fuseki:
        condition: service_started
    environment:
      - plasma.sms.feature.recommendations.enabled=false
      - plasma.sms.feature.finalizemodels.enabled=true
      - plasma.kgs.ontologies.folder=/var/ontologies
      - plasma.maria.url=jdbc:mysql://plasma-mariadb-sms:3306/plasma-sms
      - plasma.kgs.semanticmodels.store.url=http://plasma-fuseki:3030/sm
      - plasma.kgs.ontologies.store.url=http://plasma-fuseki:3030/ontologies
    expose: ["8181"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-plasma-sms

  plasma-dps:
    image: plasma/dps:${PLASMA_VERSION:-1.8.1}
    pull_policy: never
    user: root
    restart: unless-stopped
    environment:
      - plasma.dps.storage.directory=/var/plasma/localstorage
    volumes:
      - ../plasma/deploy/dps_storage:/var/plasma/localstorage
    expose: ["8182"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-plasma-dps

  plasma-frontend:
    build:
      context: ../plasma/frontend
      args:
        PLASMA_VERSION: ${PLASMA_VERSION:-1.8.1}
        PLASMA_BASE_HREF: /plasma/
        PLASMA_API_BASE_URL: /plasma
    image: plasma/ui:${PLASMA_VERSION:-1.8.1}
    restart: unless-stopped
    depends_on:
      plasma-sms:
        condition: service_started
      plasma-dps:
        condition: service_started
    expose: ["80"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-plasma-frontend

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      solid-dataspace-manager:
        condition: service_started
        restart: true
      solid-data-manager:
        condition: service_started
        restart: true
      environmental-monitoring:
        condition: service_started
        restart: true
      solid-health-app:
        condition: service_started
        restart: true
      solid-health-questionnaire:
        condition: service_started
        restart: true
      solid-tours:
        condition: service_started
        restart: true
      solid-chatbot:
        condition: service_started
        restart: true
      semantic-data-catalog-frontend:
        condition: service_started
        restart: true
      semantic-data-catalog-backend:
        condition: service_started
        restart: true
      solid-data-connection-sync-worker:
        condition: service_started
        restart: true
      plasma-frontend:
        condition: service_started
        restart: true
      node-red:
        condition: service_started
        restart: true

volumes:
  semantic_search_data:
  nodered-data:
  solid_data_connection_sync_worker_data:
  solid_data_manager_dist:
  semantic_data_catalog_dist:
  solid_health_app_dist:
  solid_tours_dist:
  solid_health_questionnaire_dist:
  solid_chatbot_dist:
  solid_chatbot_qdrant_data:
  solid_chatbot_ollama_data:
  plasma_fuseki_data:
    name: plasma_fuseki_data
  plasma_mariadb_sms:
    name: plasma_mariadb_sms
networks:
  catalog-search:
    internal: true
  solid-dataspace:
    name: solid-dataspace
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.23.0.0/16
        - subnet: fd00:1234:5678:23::/64
