services:
  solid-dataspace-manager:
    build:
      context: ../solid-dataspace-manager
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    restart: unless-stopped
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
      NPM_CONFIG_USERCONFIG: /tmp/.npmrc
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      REACT_APP_REDIRECT_URL: http://localhost
      REACT_APP_FOOTER_LOGOS: /Logo_TMDT.png
      REACT_APP_VERSION: 0.5.0
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "80"
      DATASPACE_MANAGER_PACKAGE_SOURCE: ${DATASPACE_MANAGER_PACKAGE_SOURCE:-local}
      APP_SYNC_WORKER_ENABLED: "true"
      APP_SYNC_WORKER_API_URL: /sync-worker
      APP_SYNC_WORKER_SERVICE_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      APP_SYNC_WORKER_INTERVAL_MINUTES: "5"

      APP_BRANDING_JSON: >-
        {
          "projectName": "TMDT",
          "logoUrl": "/project-logos/Logo_TMDT.png",
          "logoAlt": "TMDT Logo",
          "logoWidth": "95px",
          "logoHeight": "auto"
        }

      # Funding logo entries can also set logoWidth, logoHeight, logoMaxWidth, and logoMaxHeight.
      APP_FUNDING_LOGOS_JSON: >-
        [
          
        ]
      APP_FUNDING_GRANT_NUMBER: ""

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "environmental-monitoring",
            "title": "Environmental Monitoring",
            "href": "/web/environmental-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 15,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Solid Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": true,
            "order": 20,
            "linkType": "internal"
          },
          {
            "id": "solid-chatbot",
            "title": "Solid Chatbot",
            "href": "/web/solid-chatbot",
            "section": "applications",
            "iconKey": "rocketchat",
            "visible": ${SOLID_CHATBOT_VISIBLE:-true},
            "order": 25,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid Server",
            "issuer": "https://tmdt-solid-community-server.de",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community Server",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]

    command: sh -c "cd /app && find /app/node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true && echo \"@hoelk-f:registry=https://npm.pkg.github.com/\" > $${NPM_CONFIG_USERCONFIG} && echo \"//npm.pkg.github.com/:_authToken=$${NPM_TOKEN}\" >> $${NPM_CONFIG_USERCONFIG} && npm install && if [ \"$${DATASPACE_MANAGER_PACKAGE_SOURCE}\" = \"local\" ]; then while [ ! -f /solid-data-manager/dist/package.json ] || [ ! -f /semantic-data-catalog/dist/package.json ] || [ ! -f /solid-health-app/dist/package.json ] || [ ! -f /solid-chatbot/dist/package.json ]; do sleep 1; done; npm install --install-links=true --no-save --package-lock=false /solid-data-manager/dist /semantic-data-catalog/dist /solid-health-app/dist /solid-chatbot/dist; else npm install --no-save --package-lock=false @hoelk-f/solid-data-manager@latest @hoelk-f/semantic-data-catalog@latest @hoelk-f/solid-health-app@latest @hoelk-f/solid-chatbot@latest; fi && npm start"
    volumes:
      - ../solid-dataspace-manager:/app:delegated
      - solid_data_manager_dist:/solid-data-manager/dist
      - semantic_data_catalog_dist:/semantic-data-catalog/dist
      - solid_health_app_dist:/solid-health-app/dist
      - solid_chatbot_dist:/solid-chatbot/dist
      - /app/node_modules
    depends_on:
      - solid-data-manager
      - semantic-data-catalog-frontend
      - solid-health-app
      - solid-chatbot
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  solid-data-connection-sync-worker:
    build:
      context: ../solid-data-connection-sync-worker
    image: solid-data-connection-sync-worker:local
    restart: unless-stopped
    environment:
      PORT: 8080
      WORKER_DB_PATH: /data/participants.sqlite
      WORKER_DB_SECRET: ${SOLID_SYNC_WORKER_DB_SECRET:-solid-dataspace-dev}
      WORKER_SYNC_TICK_SECONDS: 300
      WORKER_AUTH_MODE: auto
      WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      WORKER_OIDC_ISSUER: ${SOLID_SYNC_WORKER_OIDC_ISSUER:-}
      WORKER_CLIENT_ID: ${SOLID_SYNC_WORKER_CLIENT_ID:-}
      WORKER_CLIENT_SECRET: ${SOLID_SYNC_WORKER_CLIENT_SECRET:-}
      WORKER_ALLOWED_ORIGINS: ${SOLID_SYNC_WORKER_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    volumes:
      - solid_data_connection_sync_worker_data:/data
    expose: ["8080"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-connection-sync-worker

  solid-data-manager:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PORT=3002
      - PUBLIC_URL=/solid-data-manager
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-data-manager:/app:delegated
      - solid_data_manager_dist:/app/dist
      - /app/node_modules
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-manager

  environmental-monitoring:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../environmental-monitoring:/app:delegated
      - /app/node_modules
    expose: ["5173"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-environmental-monitoring

  solid-health-app:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - PUBLIC_URL=/solid-health-app
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm start)"
    volumes:
      - ../solid-health-app:/app:delegated
      - solid_health_app_dist:/app/dist
      - /app/node_modules
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-app

  solid-chatbot:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - PUBLIC_URL=/solid-chatbot
      - REACT_APP_CHAINLIT_URL=/chainlit/
      - REACT_APP_OIDC_ISSUER=${SOLID_CHATBOT_OIDC_ISSUER:-https://tmdt-solid-community-server.de}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm run start-watch)"
    volumes:
      - ../solid-chatbot/frontend:/app:delegated
      - solid_chatbot_dist:/app/dist
      - /app/node_modules
    expose: ["3005"]
    depends_on:
      - solid-chatbot-backend
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot

  solid-chatbot-backend:
    build: ../solid-chatbot/backend
    restart: unless-stopped
    env_file:
      - ../solid-chatbot/.env
    environment:
      CHAINLIT_DISABLE_TELEMETRY: "true"
      QDRANT_URL: http://solid-chatbot-qdrant:6333
      OLLAMA_URL: http://solid-chatbot-ollama:11434
    volumes:
      - ../solid-chatbot/backend:/app:delegated
    expose: ["8001"]
    depends_on:
      solid-chatbot-qdrant:
        condition: service_started
      solid-chatbot-ollama:
        condition: service_started
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-backend

  solid-chatbot-ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_ollama_data:/root/.ollama
    expose: ["11434"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-ollama

  solid-chatbot-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_qdrant_data:/qdrant/storage
    expose: ["6333"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-chatbot-qdrant

  semantic-data-catalog-frontend:
    build:
      context: ../semantic-data-catalog/frontend
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run build:lib && (npm run build:lib:watch & npm run start-watch)"
    volumes:
      - ../semantic-data-catalog/frontend:/app/frontend:delegated
      - semantic_data_catalog_dist:/app/frontend/dist
      - /app/frontend/node_modules
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    build:
      context: ../semantic-data-catalog/backend
    restart: unless-stopped
    volumes:
      - ../semantic-data-catalog/backend:/app:delegated
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend

  semantic-data-catalog-fuseki:
    image: stain/jena-fuseki
    hostname: fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - semantic_data_catalog_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-fuseki

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      solid-dataspace-manager:
        condition: service_started
        restart: true
      solid-data-manager:
        condition: service_started
        restart: true
      environmental-monitoring:
        condition: service_started
        restart: true
      solid-health-app:
        condition: service_started
        restart: true
      solid-chatbot:
        condition: service_started
        restart: true
      semantic-data-catalog-frontend:
        condition: service_started
        restart: true
      semantic-data-catalog-backend:
        condition: service_started
        restart: true
      semantic-data-catalog-fuseki:
        condition: service_started
        restart: true
      node-red:
        condition: service_started
        restart: true
      solid-data-connection-sync-worker:
        condition: service_started
        restart: true

volumes:
  semantic_data_catalog_fuseki_data:
  nodered-data:
  solid_data_manager_dist:
  semantic_data_catalog_dist:
  solid_health_app_dist:
  solid_chatbot_dist:
  solid_chatbot_qdrant_data:
  solid_chatbot_ollama_data:
  solid_data_connection_sync_worker_data:

networks:
  solid-dataspace:
    name: solid-dataspace
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.23.0.0/16
        - subnet: fd00:1234:5678:23::/64
