version: "3.8"

services:
  solid-dataspace-manager:
    build:
      context: ../solid-dataspace-manager
    restart: unless-stopped
    environment:
      - REACT_APP_OIDC_ISSUER=https://solidcommunity.net
      - REACT_APP_REDIRECT_URL=http://localhost
      - REACT_APP_FOOTER_LOGOS=/Logo_TMDT.png
      - REACT_APP_VERSION=0.5.0
      - PORT=3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ../solid-dataspace-manager:/app:delegated
      - /app/node_modules
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  smart-city-urban-heat-monitoring:
    build:
      context: ../smart-city-urban-heat-monitoring
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../smart-city-urban-heat-monitoring:/app:delegated
      - /app/node_modules
    expose: ["4200"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-smart-city-urban-heat-monitoring

  semantic-data-catalog-frontend:
    build:
      context: ../semantic-data-catalog/frontend
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      REACT_APP_REDIRECT_URL: http://localhost/semantic-data-catalog/
      REACT_APP_FOOTER_LOGOS: /assets/images/Logo_GesundesTal.png,/assets/images/Icon_GesundesTal.png
      REACT_APP_VERSION: "0.7.4"
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../semantic-data-catalog/frontend:/app/frontend:delegated
      - /app/frontend/node_modules
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    build:
      context: ../semantic-data-catalog/backend
    restart: unless-stopped
    volumes:
      - ../semantic-data-catalog/backend:/app:delegated
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend

  semantic-data-catalog-fuseki:
    image: stain/jena-fuseki
    hostname: fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - semantic_data_catalog_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-fuseki

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    ports:
     - "1883"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - solid-dataspace-manager
      - smart-city-urban-heat-monitoring
      - semantic-data-catalog-frontend
      - semantic-data-catalog-backend
      - node-red

volumes:
  semantic_data_catalog_fuseki_data:
  nodered-data:

networks:
  solid-dataspace:
    external: true
    name: solid-dataspace
