name: solid-dataspace-live-test
services:
  solid-dataspace-manager:
    image: local/consolidation/manager:20261017-consolidation
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-dataspace-manager.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-solid-dataspace-manager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - serve
    - --config
    - /app/serve.json
    - -l
    - '3001'
    cpus: 2
    mem_limit: 2g
  solid-data-manager:
    image: local/consolidation/solid-data-manager:de02faec3d16
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-data-manager.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-solid-data-manager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  environmental-monitoring:
    image: local/consolidation/environmental-monitoring:3b8364b2f1bd
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/environmental-monitoring.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-environmental-monitoring
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  solid-health-app:
    image: local/consolidation/solid-health-app:7b56742afdea
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-health-app.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-solid-health-app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  solid-health-questionnaire:
    image: local/consolidation/solid-health-questionnaire:fc91c50a1319
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-health-questionnaire.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-solid-health-questionnaire
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  city-tours:
    image: local/consolidation/city-tours:2b4383b080f3
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/city-tours.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-city-tours
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  semantic-data-catalog-frontend:
    image: local/consolidation/catalog:20261017-consolidation
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-frontend.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-semantic-data-catalog-frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - serve
    - --config
    - /catalog/serve.json
    - -l
    - '5000'
    cpus: 2
    mem_limit: 2g
  semantic-data-catalog-backend:
    image: local/consolidation/backend:20261017-consolidation
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-backend.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-semantic-data-catalog-backend
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
  semantic-data-catalog-indexer:
    image: local/consolidation/backend:20261017-consolidation
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-indexer.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-semantic-data-catalog-indexer
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - python
    - -m
    - semantic_indexer
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
  semantic-data-catalog-fuseki:
    image: local/consolidation/semantic-data-catalog-fuseki:32101e2ec027
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-fuseki.env
    networks:
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: volume
      source: solid-dataspace-live-test_catalog_search
      target: /fuseki/databases
    - type: bind
      source: /srv/solid-dataspace-live-test/generated/fuseki.ttl
      target: /opt/fuseki/config.ttl
      read_only: true
    environment:
      JAVA_TOOL_OPTIONS: -Xmx768m
  solid-data-connection-sync-worker:
    image: local/consolidation/worker:20261017-consolidation
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-data-connection-sync-worker.env
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-solid-data-connection-sync-worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - npm
    - start
    volumes:
    - type: volume
      source: solid-dataspace-live-test_worker_preview
      target: /data
    environment:
      PUBLIC_CACHE_CATALOG_REFRESH_SECONDS: '300'
      WORKER_READ_ONLY: 'false'
      WORKER_CONNECTION_NAMESPACE: test
      STATISTICS_ENABLED: 'false'
      ENVIRONMENTAL_SCENARIO_ENABLED: 'false'
  node-red:
    image: local/consolidation/node-red:d36f20ba9ce3
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/node-red.env
    networks:
      workspace-test:
        aliases:
        - node-red
      edge:
        aliases:
        - solid-dataspace-live-test-node-red
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: bind
      source: /srv/solid-dataspace-live-test/workspace-config/node-red/settings.js
      target: /data/settings.js
      read_only: false
    - type: volume
      source: solid-dataspace-test_nodered-data
      target: /data
    profiles:
    - workspaces
  plasma-mariadb-sms:
    image: local/consolidation/plasma-mariadb-sms:57c69e064d6c
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/plasma-mariadb-sms.env
    networks:
      workspace-test:
        aliases:
        - plasma-mariadb-sms
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - mariadbd
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    volumes:
    - type: volume
      source: solid-dataspace-test2_plasma_mariadb_sms
      target: /var/lib/mysql
    profiles:
    - workspaces
  plasma-fuseki:
    image: local/consolidation/plasma-fuseki:a99855f619c4
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/plasma-fuseki.env
    networks:
      workspace-test:
        aliases:
        - plasma-fuseki
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - /jena-fuseki/fuseki-server
    volumes:
    - type: volume
      source: solid-dataspace-test2_plasma_fuseki_data
      target: /fuseki
    profiles:
    - workspaces
  plasma-sms:
    image: local/consolidation/plasma-sms:f85e03bbfa60
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/plasma-sms.env
    networks:
      workspace-test:
        aliases:
        - plasma-sms
      edge:
        aliases:
        - solid-dataspace-live-test-plasma-sms
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: volume
      source: solid-dataspace-test2_plasma_sms_configs
      target: /var/plasma/configs
    - type: volume
      source: solid-dataspace-test2_plasma_ontologies
      target: /var/ontologies
    profiles:
    - workspaces
    depends_on:
      plasma-mariadb-sms:
        condition: service_started
  plasma-dps:
    image: local/consolidation/plasma-dps:27e012fab7eb
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/plasma-dps.env
    networks:
      workspace-test:
        aliases:
        - plasma-dps
      edge:
        aliases:
        - solid-dataspace-live-test-plasma-dps
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: volume
      source: solid-dataspace-test2_plasma_dps_storage
      target: /var/plasma/localstorage
    profiles:
    - workspaces
    depends_on:
      plasma-mariadb-sms:
        condition: service_started
  plasma-frontend:
    image: local/consolidation/plasma-frontend:7cba3e1da099
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/plasma-frontend.env
    networks:
      workspace-test:
        aliases:
        - plasma-frontend
      edge:
        aliases:
        - solid-dataspace-live-test-plasma-frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
    volumes: []
    profiles:
    - workspaces
  admin-api:
    pull_policy: never
    user: 1000:1000
    init: true
    restart: unless-stopped
    read_only: true
    security_opt: &id001
    - no-new-privileges:true
    cap_drop: &id002
    - ALL
    cpus: 0.5
    mem_limit: 256m
    logging: &id003
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    tmpfs: &id004
    - /tmp:rw,noexec,nosuid,size=32m
    image: local/consolidation/live-node:7c3b093add7c
    working_dir: /app
    command:
    - node
    - server.mjs
    environment:
      PORT: '3012'
      ADMIN_SOURCE: /config-source
      ADMIN_PROFILES: test
      ADMIN_SOCKET: /ipc/control.sock
      ADMIN_IDENTITY_HOSTS: solid-community-server.tmdt.info,solidcommunity.net
      ADMIN_ISSUERS: https://solid-community-server.tmdt.info/,https://solidcommunity.net/
      ADMIN_ENVIRONMENT: test
    volumes:
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/admin-service:/app:ro
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config:/config-source:ro
    - /srv/solid-config/admin/ipc:/ipc
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-admin-api
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3012/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      admin-controller:
        condition: service_healthy
  admin-controller:
    pull_policy: never
    user: 1000:1000
    init: true
    restart: unless-stopped
    read_only: true
    security_opt: *id001
    cap_drop: *id002
    cpus: 0.5
    mem_limit: 256m
    logging: *id003
    tmpfs: *id004
    image: local/dataspace-admin-controller:20261017
    network_mode: none
    group_add:
    - '988'
    working_dir: /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager
    command:
    - python
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/admin-service/controller.py
    environment:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOCKER_CONFIG: /tmp/docker-config
      ADMIN_SOURCE: /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config
      ADMIN_STATE: /srv/solid-config/admin/state
      ADMIN_SOCKET: /srv/solid-config/admin/ipc/control.sock
      ADMIN_RUNTIME: /srv/solid-config/consolidated
      ADMIN_CADDY_CONFIG: /srv/solid-config/Caddyfile
      ADMIN_PROFILES: test
      ADMIN_IDENTITY_HOSTS: solid-community-server.tmdt.info,solidcommunity.net
      ADMIN_ENVIRONMENT: test
      ADMIN_STACK: /srv/solid-dataspace-live-test
      ADMIN_API_CONTAINER: solid-dataspace-live-test-admin-api-1
    volumes:
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/admin-service:/home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/admin-service:ro
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/scripts/deployment:/home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace-manager/scripts/deployment:ro
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config:/home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config
    - /srv/solid-config:/srv/solid-config
    - /usr/bin/docker:/usr/bin/docker:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - /srv/solid-dataspace-live-test:/srv/solid-dataspace-live-test
    - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.socket(socket.AF_UNIX); s.connect('/srv/solid-config/admin/ipc/control.sock');
        s.close()
      interval: 20s
      timeout: 5s
      retries: 3
  account-handoff:
    image: local/solid-account-handoff:20261016
    pull_policy: never
    user: 1000:1000
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cpus: 0.25
    mem_limit: 128m
    environment:
      SOLID_ISSUER: https://solid-community-server.tmdt.info
      SOLID_UPSTREAM: http://css:80
      DATASPACE_ORIGINS: '["https://solid-dataspace-test.tmdt.info","https://www.solid-dataspace-test.tmdt.info","https://solid-dataspace-test2.tmdt.info","https://www.solid-dataspace-test2.tmdt.info"]'
    networks:
      edge:
        aliases:
        - solid-dataspace-live-test-account-handoff
      solid: {}
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  edge:
    name: solid-dataspace-live-test-edge
  search:
    internal: true
  workspace-test:
    internal: true
  solid:
    external: true
    name: solid-dataspace
volumes:
  solid-dataspace-live-test_catalog_search:
    name: solid-dataspace-live-test_catalog_search
  solid-dataspace-live-test_worker_preview:
    name: solid-dataspace-live-test_worker_preview
  solid-dataspace-test_nodered-data:
    external: true
    name: solid-dataspace-test_nodered-data
  solid-dataspace-test2_plasma_mariadb_sms:
    external: true
    name: solid-dataspace-test2_plasma_mariadb_sms
  solid-dataspace-test2_plasma_fuseki_data:
    external: true
    name: solid-dataspace-test2_plasma_fuseki_data
  solid-dataspace-test2_plasma_sms_configs:
    external: true
    name: solid-dataspace-test2_plasma_sms_configs
  solid-dataspace-test2_plasma_ontologies:
    external: true
    name: solid-dataspace-test2_plasma_ontologies
  solid-dataspace-test2_plasma_dps_storage:
    external: true
    name: solid-dataspace-test2_plasma_dps_storage
