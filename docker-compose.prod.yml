        condition: service_started
  timberconnect-plasma-frontend:
    image: local/consolidation/plasma-frontend:7cba3e1da099
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/timberconnect-plasma-frontend.env
    networks:
      workspace-timberconnect:
        aliases:
        - plasma-frontend
      edge:
        aliases:
        - solid-dataspace-prod-timberconnect-plasma-frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
    volumes: []
    profiles:
    - workspaces
  admin-api:
    pull_policy: if_not_present
    user: 1000:1000
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    image: son1i/solid-dataspace-admin-api@sha256:afa46f67a098512962b2b7aa24941ed751157dd7badd16061b215f8f9d9fc337
    working_dir: /app
    command:
    - node
    - server.mjs
    environment:
      PORT: '3012'
      ADMIN_SOURCE: /config-source
      ADMIN_PROFILES: stadt-wuppertal,dace,timberconnect
      ADMIN_SOCKET: /ipc/control.sock
      ADMIN_IDENTITY_HOSTS: solid-community-server.tmdt.info,solidcommunity.net
      ADMIN_ISSUERS: https://solid-community-server.tmdt.info/,https://solidcommunity.net/
      ADMIN_ENVIRONMENT: prod
      WORKER_ACCESS_KEY_FILE: /run/secrets/worker-access-key
    volumes:
    - /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config:/config-source:ro
    - /srv/solid-config/admin-prod/ipc:/ipc
    - type: bind
      source: ./secrets/worker-access.key
      target: /run/secrets/worker-access-key
      read_only: true
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-admin-api
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3012/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      admin-controller:
        condition: service_healthy
  admin-controller:
    pull_policy: if_not_present
    user: 1000:1000
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
