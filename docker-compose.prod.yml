name: solid-dataspace-prod
services:
  solid-dataspace-manager:
    image: son1i/solid-dataspace-manager@sha256:7fa9438d726ff8ba47b4b237ee68843caec2cbce40aeb5b373f2c93c44c94240
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/solid-dataspace-manager.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-solid-dataspace-manager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - serve
    - --config
    - /app/serve.json
    - -l
    - '3001'
    cpus: 2
    mem_limit: 2g
  solid-data-manager:
    image: local/consolidation/solid-data-manager:de02faec3d16
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-data-manager.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-solid-data-manager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  environmental-monitoring:
    image: local/consolidation/environmental-monitoring:3b8364b2f1bd
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/environmental-monitoring.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-environmental-monitoring
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  solid-health-app:
    image: local/consolidation/solid-health-app:7b56742afdea
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-health-app.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-solid-health-app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  solid-health-questionnaire:
    image: local/consolidation/solid-health-questionnaire:fc91c50a1319
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/solid-health-questionnaire.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-solid-health-questionnaire
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  city-tours:
    image: son1i/city-tours@sha256:ffeeef29d139052b8f97a8ba29e70178741e6039b3ec85d8399a3a08d9aca628
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/city-tours.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-city-tours
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - nginx
    - -g
    - daemon off;
  semantic-data-catalog-frontend:
    image: son1i/semantic-data-catalog-frontend@sha256:8449577340b8a82c3a84f6413474fcbf376c042e0233e9d03b8de1eac3897604
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-frontend.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-semantic-data-catalog-frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - sh
    - -c
    - mkdir -p /tmp/catalog-site && ln -s /app/frontend/build /tmp/catalog-site/semantic-data-catalog
      && exec serve --config /runtime/catalog-serve.json -l 5000
    cpus: 2
    mem_limit: 2g
    volumes:
    - type: bind
      source: /home/solid/repos/solid-dataspace/.worktrees/dataspace-consolidation/solid-dataspace/config/deployment/catalog-serve.json
      target: /runtime/catalog-serve.json
      read_only: true
  semantic-data-catalog-backend:
    image: son1i/semantic-data-catalog-backend@sha256:b9006fcd29941a673a4bdc978d0390f60909e9c610221433963653cc9f70c89c
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-backend.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-semantic-data-catalog-backend
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
  semantic-data-catalog-indexer:
    image: son1i/semantic-data-catalog-backend@sha256:b9006fcd29941a673a4bdc978d0390f60909e9c610221433963653cc9f70c89c
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-indexer.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-semantic-data-catalog-indexer
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - python
    - -m
    - semantic_indexer
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
  semantic-data-catalog-fuseki:
    image: local/consolidation/semantic-data-catalog-fuseki:32101e2ec027
    pull_policy: never
    restart: unless-stopped
    env_file:
    - secrets/semantic-data-catalog-fuseki.env
    networks:
      search: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: volume
      source: solid-dataspace-prod_catalog_search
      target: /fuseki/databases
    - type: bind
      source: /srv/solid-dataspace-prod/generated/fuseki.ttl
      target: /opt/fuseki/config.ttl
      read_only: true
    environment:
      JAVA_TOOL_OPTIONS: -Xmx768m
  solid-data-connection-sync-worker:
    image: son1i/solid-data-connection-sync-worker@sha256:6ac101e0f2814143a4ec5d8f7472ff0985430084ffa19ffe692fd9ac288c3117
    pull_policy: if_not_present
    restart: unless-stopped
    env_file:
    - secrets/solid-data-connection-sync-worker.env
    networks:
      edge:
        aliases:
        - solid-dataspace-prod-solid-data-connection-sync-worker
      legacy-edge:
        aliases:
        - solid-data-connection-sync-worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - npm
    - start
    volumes:
    - type: volume
      source: solid-data-connection-sync-worker_solid_data_connection_sync_worker_data
      target: /data
    - type: bind
      source: ./secrets/worker-access.key
      target: /run/secrets/worker-access-key
      read_only: true
    environment:
      WORKER_ACCESS_KEY_FILE: /run/secrets/worker-access-key
