name: solid-dataspace-test

# Replace these three values before the first start. They intentionally live
# here because this server stack is managed as one self-contained Compose file.
x-plasma-secrets:
  database-password: &plasma-database-password "REPLACE_BEFORE_FIRST_START_DB_PASSWORD"
  database-root-password: &plasma-database-root-password "REPLACE_BEFORE_FIRST_START_DB_ROOT_PASSWORD"
  fuseki-admin-password: &plasma-fuseki-admin-password "REPLACE_BEFORE_FIRST_START_FUSEKI_PASSWORD"

services:
  solid-dataspace-manager:
    image: son1i/solid-dataspace-manager:latest
    restart: unless-stopped
    environment:
      APP_PLASMA_URL: "/plasma/modelings"
      APP_BRANDING_JSON: >-
        {
          "projectName": "Test Instance",
          "logoUrl": "/project-logos/Logo_TMDT.png",
          "logoAlt": "Test Instance Logo",
          "logoWidth": "95px",
          "logoHeight": "auto"
        }

      APP_FUNDING_LOGOS_JSON: >-
        [

        ]
      APP_FUNDING_GRANT_NUMBER: ""

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "environmental-monitoring",
            "title": "Environmental Monitoring",
            "href": "/web/environmental-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 15,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Solid Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": true,
            "order": 20,
            "linkType": "internal"
          },
          {
            "id": "solid-chatbot",
            "title": "Solid Chatbot",
            "href": "/web/solid-chatbot",
            "section": "applications",
            "iconKey": "rocketchat",
            "visible": true,
            "order": 25,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid",
            "issuer": "https://solid-community-server.tmdt.info",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]
      APP_SYNC_WORKER_ENABLED: "true"
      APP_SYNC_WORKER_API_URL: "/sync-worker"
      APP_SYNC_WORKER_SERVICE_WEBID: "https://solid-community-server.tmdt.info/solidserviceworker/profile/card#me"
      APP_SYNC_WORKER_INTERVAL_MINUTES: "10"
      APP_STATISTICS_ENABLED: "true"
      APP_STATISTICS_ADMIN_WEBIDS_JSON: >-
        ["https://solid-community-server.tmdt.info/solidtestpod/profile/card#me"]
      APP_STATISTICS_WORKER_WEBID: "https://solid-community-server.tmdt.info/solidserviceworker/profile/card#me"
      APP_STATISTICS_POD_BASE_URL: "https://solid-community-server.tmdt.info/solidtestpod/statistics/"
      APP_STATISTICS_EVENTS_URL: "https://solid-community-server.tmdt.info/solidtestpod/statistics/events/catalog-instances/test/downloads/"
      APP_STATISTICS_ACTIVITY_RESOURCE_PATH: "statistics/activity/activity.ttl"
      APP_STATISTICS_TIMEZONE: "Europe/Berlin"
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-dataspace-manager

  solid-data-manager:
    image: son1i/solid-data-manager:latest
    restart: unless-stopped
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-data-manager

  environmental-monitoring:
    image: son1i/environmental-monitoring:latest
    restart: unless-stopped
    expose: ["5173"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-environmental-monitoring

  solid-health-app:
    image: son1i/solid-health-app:latest
    restart: unless-stopped
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-health-app

  solid-chatbot:
    image: son1i/solid-chatbot-frontend:latest
    restart: unless-stopped
    expose: ["3005"]
    depends_on:
      - solid-chatbot-backend
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-chatbot

  solid-chatbot-backend:
    image: son1i/solid-chatbot-backend:latest
    restart: unless-stopped
    environment:
      CHAINLIT_DISABLE_TELEMETRY: "true"
      QDRANT_URL: http://solid-chatbot-qdrant:6333
      OLLAMA_URL: http://solid-chatbot-ollama:11434
    expose: ["8001"]
    depends_on:
      solid-chatbot-qdrant:
        condition: service_started
      solid-chatbot-ollama:
        condition: service_started
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-chatbot-backend

  solid-chatbot-ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_ollama_data:/root/.ollama
    expose: ["11434"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-chatbot-ollama

  solid-chatbot-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - solid_chatbot_qdrant_data:/qdrant/storage
    expose: ["6333"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-solid-chatbot-qdrant

  semantic-data-catalog-frontend:
    image: son1i/semantic-data-catalog-frontend:latest
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
      STATISTICS_ENABLED: "true"
      STATISTICS_POD_BASE_URL: "https://solid-community-server.tmdt.info/solidtestpod/statistics/"
      STATISTICS_EVENTS_URL: "https://solid-community-server.tmdt.info/solidtestpod/statistics/events/catalog-instances/test/downloads/"
      STATISTICS_REGISTRY_CONTEXT: "https://solid-community-server.tmdt.info/semanticdatacatalog/public/test"
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    image: son1i/semantic-data-catalog-backend:latest
    restart: unless-stopped
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-semantic-data-catalog-backend

  plasma-storage-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -ec
      - chown -R 1000:1000 /var/plasma/configs /var/ontologies /var/plasma/localstorage
    volumes:
      - plasma_sms_configs:/var/plasma/configs
      - plasma_ontologies:/var/ontologies
      - plasma_dps_storage:/var/plasma/localstorage

  plasma-fuseki:
    image: saiye/fuseki:4.7.0
    restart: unless-stopped
    environment:
      FUSEKI_DATASET_1: sm
      FUSEKI_DATASET_2: ontologies
      ADMIN_PASSWORD: *plasma-fuseki-admin-password
    volumes:
      - plasma_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      - plasma-internal

  plasma-mariadb-sms:
    image: mariadb:12.3.2
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: plasma-sms
      MARIADB_USER: plasma
      MARIADB_PASSWORD: *plasma-database-password
      MARIADB_ROOT_PASSWORD: *plasma-database-root-password
    volumes:
      - plasma_mariadb_sms:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u "$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    expose: ["3306"]
    networks:
      - plasma-internal

  plasma-sms:
    image: son1i/plasma-sms:1.8.1-test.1
    restart: unless-stopped
    depends_on:
      plasma-storage-init:
        condition: service_completed_successfully
      plasma-mariadb-sms:
        condition: service_healthy
      plasma-fuseki:
        condition: service_started
    environment:
      plasma.sms.feature.recommendations.enabled: "false"
      plasma.sms.feature.finalizemodels.enabled: "true"
      plasma.config.local.path: /var/plasma/configs
      plasma.kgs.ontologies.folder: /var/ontologies
      plasma.maria.url: jdbc:mysql://plasma-mariadb-sms:3306/plasma-sms
      plasma.maria.username: plasma
      plasma.maria.password: *plasma-database-password
      plasma.kgs.semanticmodels.store.url: http://plasma-fuseki:3030/sm
      plasma.kgs.ontologies.store.url: http://plasma-fuseki:3030/ontologies
    volumes:
      - plasma_sms_configs:/var/plasma/configs
      - plasma_ontologies:/var/ontologies
    expose: ["8181"]
    networks:
      plasma-internal:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-plasma-sms

  plasma-dps:
    image: son1i/plasma-dps:1.8.1-test.1
    restart: unless-stopped
    depends_on:
      plasma-storage-init:
        condition: service_completed_successfully
    environment:
      plasma.dps.storage.directory: /var/plasma/localstorage
    volumes:
      - plasma_dps_storage:/var/plasma/localstorage
    expose: ["8182"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-plasma-dps

  plasma-frontend:
    image: son1i/plasma-frontend:1.8.1-test.1
    restart: unless-stopped
    depends_on:
      plasma-sms:
        condition: service_started
      plasma-dps:
        condition: service_started
    expose: ["80"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-plasma-frontend

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    ports:
      - "1883"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-test-node-red

volumes:
  semantic_data_catalog_fuseki_data:
  nodered-data:
  solid_chatbot_qdrant_data:
  solid_chatbot_ollama_data:
  plasma_fuseki_data:
  plasma_mariadb_sms:
  plasma_sms_configs:
  plasma_ontologies:
  plasma_dps_storage:

networks:
  plasma-internal:
    internal: true
  solid-dataspace:
    external: true
    name: solid-dataspace
