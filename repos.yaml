    scope:
      - backend
      - frontend
      - fuseki
      - database
      - oidc

  environmental-monitoring:
    path: ..\environmental-monitoring
    repo: https://github.com/hoelk-f/environmental-monitoring
    scope:
      - react
      - vite
      - ui
      - environmental

  solid-dataspace-manager:
