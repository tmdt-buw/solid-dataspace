services:
  solid-dataspace-manager:
    environment:
      APP_PLASMA_URL: ${PLASMA_PUBLIC_URL:-/plasma/modelings}

  plasma-storage-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -ec
      - chown -R 1000:1000 /var/plasma/configs /var/ontologies /var/plasma/localstorage
    volumes:
      - plasma_sms_configs:/var/plasma/configs
      - plasma_ontologies:/var/ontologies
      - plasma_dps_storage:/var/plasma/localstorage

  plasma-fuseki:
    image: saiye/fuseki:4.7.0
    restart: unless-stopped
    environment:
      FUSEKI_DATASET_1: sm
      FUSEKI_DATASET_2: ontologies
      ADMIN_PASSWORD: ${PLASMA_FUSEKI_ADMIN_PASSWORD:?set PLASMA_FUSEKI_ADMIN_PASSWORD}
    volumes:
      - plasma_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      - plasma-internal

  plasma-mariadb-sms:
    image: mariadb:12.3.2
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: plasma-sms
      MARIADB_USER: plasma
      MARIADB_PASSWORD: ${PLASMA_DB_PASSWORD:?set PLASMA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${PLASMA_DB_ROOT_PASSWORD:?set PLASMA_DB_ROOT_PASSWORD}
    volumes:
      - plasma_mariadb_sms:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u "$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    expose: ["3306"]
    networks:
      - plasma-internal

  plasma-sms:
    image: son1i/plasma-sms:${PLASMA_VERSION:?set PLASMA_VERSION}
    restart: unless-stopped
    depends_on:
      plasma-storage-init:
        condition: service_completed_successfully
      plasma-mariadb-sms:
        condition: service_healthy
      plasma-fuseki:
        condition: service_started
    environment:
      plasma.sms.feature.recommendations.enabled: "false"
      plasma.sms.feature.finalizemodels.enabled: "true"
      plasma.config.local.path: /var/plasma/configs
      plasma.kgs.ontologies.folder: /var/ontologies
      plasma.maria.url: jdbc:mysql://plasma-mariadb-sms:3306/plasma-sms
      plasma.maria.username: plasma
      plasma.maria.password: ${PLASMA_DB_PASSWORD:?set PLASMA_DB_PASSWORD}
      plasma.kgs.semanticmodels.store.url: http://plasma-fuseki:3030/sm
      plasma.kgs.ontologies.store.url: http://plasma-fuseki:3030/ontologies
    volumes:
      - plasma_sms_configs:/var/plasma/configs
      - plasma_ontologies:/var/ontologies
    expose: ["8181"]
    networks:
      plasma-internal:
      solid-dataspace:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-solid-dataspace}-plasma-sms

  plasma-dps:
    image: son1i/plasma-dps:${PLASMA_VERSION:?set PLASMA_VERSION}
    restart: unless-stopped
    depends_on:
      plasma-storage-init:
        condition: service_completed_successfully
    environment:
      plasma.dps.storage.directory: /var/plasma/localstorage
    volumes:
      - plasma_dps_storage:/var/plasma/localstorage
    expose: ["8182"]
    networks:
      solid-dataspace:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-solid-dataspace}-plasma-dps

  plasma-frontend:
    image: son1i/plasma-frontend:${PLASMA_VERSION:?set PLASMA_VERSION}
    restart: unless-stopped
    depends_on:
      plasma-sms:
        condition: service_started
      plasma-dps:
        condition: service_started
    expose: ["80"]
    networks:
      solid-dataspace:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-solid-dataspace}-plasma-frontend

volumes:
  plasma_fuseki_data:
  plasma_mariadb_sms:
  plasma_sms_configs:
  plasma_ontologies:
  plasma_dps_storage:

networks:
  plasma-internal:
    internal: true
