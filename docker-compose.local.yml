# docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d
# Requires Docker Compose >= 2.24.4 (!reset / !override).
name: solid-dataspace-local
services:
  local-init:
    image: node:22-alpine
    restart: 'no'
    command: [node, /local/init.cjs]
    volumes:
      - ./local:/local:ro
      - local_secrets:/secrets
    network_mode: none

  access-gateway:
    image: ${LOCAL_GATEWAY_IMAGE:-son1i/solid-dataspace-admin-api:0.4.17}
    command: [node, /app/local.mjs]
    restart: unless-stopped
    environment:
      LOCAL_ORIGIN: http://localhost:${LOCAL_HTTP_PORT:-8080}
      LOCAL_ISSUER: ${LOCAL_ISSUER:-https://solid-community-server.tmdt.info}
      LOCAL_REGISTRY_URL: ${LOCAL_REGISTRY_URL:-}
      LOCAL_ADMIN_WEBIDS_JSON: ${LOCAL_ADMIN_WEBIDS_JSON:-[]}
      LOCAL_PLASMA_ENABLED: ${LOCAL_PLASMA_ENABLED:-false}
      LOCAL_NODERED_ENABLED: ${LOCAL_NODERED_ENABLED:-false}
      SOLID_SYNC_WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
    volumes:
      - ./local/gateway.mjs:/app/local.mjs:ro
      - local_secrets:/secrets:ro
    depends_on:
      local-init:
        condition: service_completed_successfully
    networks: [solid-dataspace]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3012/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  solid-dataspace-manager:
    image: ${LOCAL_MANAGER_IMAGE:-son1i/solid-dataspace-manager:latest}
    depends_on: !override
      access-gateway:
        condition: service_healthy
    environment:
      APP_DATASPACE_ID: test
      APP_STATISTICS_ENABLED: 'false'
      APP_STATISTICS_ADMIN_WEBIDS_JSON: '[]'
      APP_SYNC_WORKER_API_URL: /sync-worker
      APP_PLASMA_URL: /plasma/modelings

  semantic-data-catalog-frontend:
    environment:
      STATISTICS_ENABLED: 'false'
      STATISTICS_REGISTRY_CONTEXT: test

  semantic-data-catalog-backend:
    profiles: [search]
    environment:
      CATALOG_DATASPACE_ID: test
      CATALOG_REGISTRY_URL: ${LOCAL_REGISTRY_URL:-}
  semantic-data-catalog-indexer:
    profiles: [search]
    environment:
      CATALOG_DATASPACE_ID: test
      CATALOG_REGISTRY_URL: ${LOCAL_REGISTRY_URL:-}
  semantic-data-catalog-fuseki:
    profiles: [search]

  solid-data-connection-sync-worker:
    image: ${LOCAL_WORKER_IMAGE:-son1i/solid-data-connection-sync-worker:latest}
    command: [node, /local/worker-start.mjs]
    environment: !override
      PORT: '8080'
      WORKER_DB_PATH: /data/participants.sqlite
      WORKER_AUTH_MODE: service
      WORKER_CONNECTION_NAMESPACE: test
      WORKER_ACCESS_KEY_FILE: /secrets/worker-access.key
      WORKER_ALLOWED_ORIGINS: http://localhost:${LOCAL_HTTP_PORT:-8080}
      WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      WORKER_OIDC_ISSUER: ${LOCAL_ISSUER:-https://solid-community-server.tmdt.info}
      WORKER_CLIENT_ID: ${SOLID_SYNC_WORKER_CLIENT_ID:-}
      WORKER_CLIENT_SECRET: ${SOLID_SYNC_WORKER_CLIENT_SECRET:-}
      WORKER_SYNC_TICK_SECONDS: ${LOCAL_SYNC_TICK_SECONDS:-600}
      PUBLIC_CACHE_ENABLED: ${LOCAL_PUBLIC_CACHE_ENABLED:-false}
      PUBLIC_CACHE_REGISTRIES_JSON: ${LOCAL_REGISTRIES_JSON:-[]}
      STATISTICS_ENABLED: 'false'
      STATISTICS_REGISTRIES_JSON: '[]'
      ENVIRONMENTAL_SCENARIO_ENABLED: 'false'
      ENVIRONMENTAL_SCENARIO_REGISTRIES_JSON: '[]'
    volumes:
      - ./local:/local:ro
      - local_secrets:/secrets:ro
    depends_on:
      local-init:
        condition: service_completed_successfully

  node-red:
    profiles: [node-red]

  caddy:
    container_name: !reset null
    ports: !override
      - '127.0.0.1:${LOCAL_HTTP_PORT:-8080}:80'
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: !override
      access-gateway:
        condition: service_healthy

  plasma-fuseki:
    image: saiye/fuseki:4.7.0
    profiles: [plasma]
    environment:
      FUSEKI_DATASET_1: sm
      FUSEKI_DATASET_2: ontologies
      ADMIN_PASSWORD: local-plasma
      JAVA_TOOL_OPTIONS: -Xmx384m
    volumes: [plasma_fuseki_data:/fuseki]
    networks: [solid-dataspace]
  plasma-mariadb-sms:
    image: mariadb:11.4
    profiles: [plasma]
    environment:
      MYSQL_DATABASE: plasma-sms
      MYSQL_ROOT_PASSWORD: local-plasma
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [plasma_mariadb_data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [solid-dataspace]
  plasma-init:
    image: node:22-alpine
    profiles: [plasma]
    command: [node, -e, "const fs=require('fs');for(const p of ['/configs','/ontologies'])fs.chownSync(p,1000,1000)"]
    network_mode: none
    volumes:
      - plasma_configs:/configs
      - plasma_ontologies:/ontologies
  plasma-sms:
    image: son1i/plasma-sms:${LOCAL_PLASMA_TAG:-sha-7ae77d7baab4}
    platform: linux/amd64
    profiles: [plasma]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      plasma.sms.feature.recommendations.enabled: 'false'
      plasma.sms.feature.finalizemodels.enabled: 'true'
      plasma.maria.url: jdbc:mysql://plasma-mariadb-sms:3306/plasma-sms
      plasma.maria.username: root
      plasma.maria.password: local-plasma
      plasma.kgs.semanticmodels.store.url: http://plasma-fuseki:3030/sm
      plasma.kgs.ontologies.store.url: http://plasma-fuseki:3030/ontologies
      plasma.kgs.ontologies.folder: /var/ontologies
    volumes:
      - plasma_configs:/var/plasma/configs
      - plasma_ontologies:/var/ontologies
    depends_on:
      plasma-init:
        condition: service_completed_successfully
      plasma-mariadb-sms:
        condition: service_healthy
      plasma-fuseki:
        condition: service_started
    networks: [solid-dataspace]
  plasma-dps:
    image: son1i/plasma-dps:${LOCAL_PLASMA_TAG:-sha-7ae77d7baab4}
    platform: linux/amd64
    profiles: [plasma]
    user: root
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      plasma.dps.storage.directory: /var/plasma/localstorage
    volumes: [plasma_storage:/var/plasma/localstorage]
    networks: [solid-dataspace]
  plasma-frontend:
    image: son1i/plasma-frontend:${LOCAL_PLASMA_TAG:-sha-7ae77d7baab4}
    platform: linux/amd64
    profiles: [plasma]
    networks: [solid-dataspace]

volumes:
  local_secrets:
  plasma_fuseki_data:
  plasma_mariadb_data:
  plasma_storage:
  plasma_configs:
  plasma_ontologies:
networks:
  solid-dataspace: !override {}
