services:
  solid-dataspace-manager:
    image: son1i/solid-dataspace-manager:latest
    restart: unless-stopped
    environment:
      APP_BRANDING_JSON: >-
        {
          "projectName": "Gesundes Tal",
          "logoUrl": "/project-logos/GesundesTal_Logo.png",
          "logoAlt": "Gesundes Tal Logo"
        }

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "smart-city-environmental-monitoring",
            "title": "Environmental Monitoring",
            "href": "/web/smart-city-environmental-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 15,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Solid Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": true,
            "order": 20,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid",
            "issuer": "https://tmdt-solid-community-server.de",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  solid-data-manager:
    image: son1i/solid-data-manager:latest
    restart: unless-stopped
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-manager

  smart-city-environmental-monitoring:
    image: son1i/smart-city-environmental-monitoring:latest
    restart: unless-stopped
    expose: ["5173"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-smart-city-environmental-monitoring

  solid-health-app:
    image: son1i/solid-health-app:latest
    restart: unless-stopped
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-app

  semantic-data-catalog-frontend:
    image: son1i/semantic-data-catalog-frontend:latest
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solidcommunity.net
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    image: son1i/semantic-data-catalog-backend:latest
    restart: unless-stopped
    expose: ["8000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend

  semantic-data-catalog-fuseki:
    image: stain/jena-fuseki
    hostname: fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - semantic_data_catalog_fuseki_data:/fuseki
    expose: ["3030"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-fuseki

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    ports:
      - "1883"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - solid-dataspace-manager
      - solid-data-manager
      - smart-city-environmental-monitoring
      - solid-health-app
      - semantic-data-catalog-frontend
      - semantic-data-catalog-backend
      - node-red

volumes:
  semantic_data_catalog_fuseki_data:
  nodered-data:

networks:
  solid-dataspace:
    external: true
    name: solid-dataspace