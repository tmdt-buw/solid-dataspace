services:
  solid-dataspace-manager:
    image: son1i/solid-dataspace-manager:latest
    restart: unless-stopped
    environment:
      APP_BRANDING_JSON: >-
        {
          "projectName": "TMDT",
          "logoUrl": "/project-logos/Logo_TMDT.png",
          "logoAlt": "TMDT Logo",
          "logoWidth": "95px",
          "logoHeight": "auto"
        }

      # Funding logo entries can also set logoWidth, logoHeight, logoMaxWidth, and logoMaxHeight.
      APP_FUNDING_LOGOS_JSON: >-
        [
          
        ]
      APP_FUNDING_GRANT_NUMBER: ""

      APP_CONFIG_APPS_JSON: >-
        [
          {
            "id": "environmental-monitoring",
            "title": "Environmental Monitoring",
            "href": "/web/environmental-monitoring",
            "section": "applications",
            "iconKey": "temperature",
            "visible": true,
            "order": 15,
            "linkType": "internal"
          },
          {
            "id": "solid-health-app",
            "title": "Health App",
            "href": "/web/solid-health-app",
            "section": "applications",
            "iconKey": "health",
            "visible": true,
            "order": 20,
            "linkType": "internal"
          },
          {
            "id": "city-tours",
            "title": "City Tours",
            "href": "/web/city-tours",
            "section": "applications",
            "iconKey": "tour",
            "visible": ${CITY_TOURS_VISIBLE:-${SOLID_TOURS_VISIBLE:-true}},
            "order": 22,
            "linkType": "internal"
          },
          {
            "id": "solid-health-questionnaire",
            "title": "Health Questionnaire",
            "href": "/web/solid-health-questionnaire",
            "section": "applications",
            "iconKey": "questionnaire",
            "visible": ${SOLID_HEALTH_QUESTIONNAIRE_VISIBLE:-true},
            "order": 24,
            "linkType": "internal"
          }
        ]

      APP_CONFIG_PROVIDERS_JSON: >-
        [
          {
            "id": "tmdt-solid",
            "label": "TMDT Solid Server",
            "issuer": "https://solid-community-server.tmdt.info",
            "note": "Recommended",
            "enabled": true,
            "recommended": true
          },
          {
            "id": "solid-community",
            "label": "Solid Community Server",
            "issuer": "https://solidcommunity.net",
            "note": "Public community server",
            "enabled": true,
            "recommended": false
          }
        ]
      # Use one deployment-scoped ID for the Manager and catalog. Keep the
      # legacy scenario variable as the final compatibility fallback only.
      APP_DATASPACE_ID: ${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-}}}
      APP_SYNC_WORKER_ENABLED: ${SOLID_SYNC_WORKER_ENABLED:-true}
      APP_SYNC_WORKER_API_URL: ${SOLID_SYNC_WORKER_API_URL:-/sync-worker}
      APP_CITY_TOURS_LEGACY_CONTINUOUS_WEBIDS_JSON: ${CITY_TOURS_LEGACY_CONTINUOUS_WEBIDS_JSON:-[]}
      APP_SYNC_WORKER_SERVICE_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      APP_SYNC_WORKER_INTERVAL_MINUTES: "10"
      APP_STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      APP_STATISTICS_ADMIN_WEBIDS_JSON: >-
        ${STATISTICS_ADMIN_WEBIDS_JSON:-["https://solid-community-server.tmdt.info/solidtestpod/profile/card#me"]}
      APP_STATISTICS_WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-https://solid-community-server.tmdt.info/solidserviceworker/profile/card#me}
      APP_STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      APP_STATISTICS_EVENTS_URL: ${STATISTICS_EVENTS_URL:-${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-__unconfigured__}}}/downloads/}
      APP_STATISTICS_ACTIVITY_RESOURCE_PATH: ${STATISTICS_ACTIVITY_RESOURCE_PATH:-statistics/activity/activity.ttl}
      APP_STATISTICS_TIMEZONE: ${STATISTICS_TIMEZONE:-Europe/Berlin}
    expose: ["3001"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-dataspace-manager

  solid-data-manager:
    image: son1i/solid-data-manager:latest
    restart: unless-stopped
    expose: ["3002"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-manager

  environmental-monitoring:
    image: son1i/environmental-monitoring:latest
    restart: unless-stopped
    expose: ["5173"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-environmental-monitoring

  solid-health-app:
    image: son1i/solid-health-app:latest
    restart: unless-stopped
    expose: ["3000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-app

  solid-health-questionnaire:
    image: son1i/solid-health-questionnaire:latest
    restart: unless-stopped
    expose: ["3007"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-health-questionnaire

  city-tours:
    image: son1i/city-tours:latest
    restart: unless-stopped
    expose: ["3006"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-city-tours

  semantic-data-catalog-frontend:
    image: son1i/semantic-data-catalog-frontend:latest
    restart: unless-stopped
    environment:
      REACT_APP_OIDC_ISSUER: https://solid-community-server.tmdt.info
      STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      STATISTICS_EVENTS_URL: ${STATISTICS_EVENTS_URL:-${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-__unconfigured__}}}/downloads/}
      STATISTICS_REGISTRY_CONTEXT: ${DATASPACE_ID:-${STATISTICS_REGISTRY_CONTEXT:-${ENVIRONMENTAL_SCENARIO_DATASPACE_ID:-}}}
    expose: ["5000"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-frontend

  semantic-data-catalog-backend:
    image: son1i/semantic-data-catalog-backend:latest
    restart: unless-stopped
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
    environment:
      CATALOG_DATASPACE_ID: ${DATASPACE_ID:-}
      CATALOG_REGISTRY_URL: ${CATALOG_REGISTRY_URL:-https://solid-community-server.tmdt.info/semanticdatacatalog/public/${DATASPACE_ID:-__unconfigured__}/}
      CATALOG_FUSEKI_URL: http://semantic-data-catalog-fuseki:3030/catalog
      CATALOG_INDEX_INTERVAL_SECONDS: ${CATALOG_INDEX_INTERVAL_SECONDS:-300}
      CATALOG_INDEX_MAX_AGE_SECONDS: ${CATALOG_INDEX_MAX_AGE_SECONDS:-900}
      CATALOG_SERVICE_WEBID: ${CATALOG_SERVICE_WEBID:-https://solid-community-server.tmdt.info/solidservice/profile/card#me}
      CATALOG_SERVICE_OIDC_ISSUER: ${CATALOG_SERVICE_OIDC_ISSUER:-https://solid-community-server.tmdt.info}
      CATALOG_SERVICE_CLIENT_ID: ${CATALOG_SERVICE_CLIENT_ID:-}
      CATALOG_SERVICE_CLIENT_SECRET: ${CATALOG_SERVICE_CLIENT_SECRET:-}
      CATALOG_SERVICE_TOKEN_URL: ${CATALOG_SERVICE_TOKEN_URL:-}
    expose: ["8000"]
    networks:
      catalog-search: {}
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-semantic-data-catalog-backend


  semantic-data-catalog-indexer:
    image: son1i/semantic-data-catalog-backend:latest
    command: ["python", "-m", "semantic_indexer"]
    restart: unless-stopped
    environment:
      CATALOG_DATASPACE_ID: ${DATASPACE_ID:-}
      CATALOG_REGISTRY_URL: ${CATALOG_REGISTRY_URL:-https://solid-community-server.tmdt.info/semanticdatacatalog/public/${DATASPACE_ID:-__unconfigured__}/}
      CATALOG_FUSEKI_URL: http://semantic-data-catalog-fuseki:3030/catalog
      CATALOG_INDEX_INTERVAL_SECONDS: ${CATALOG_INDEX_INTERVAL_SECONDS:-300}
      CATALOG_INDEX_MAX_AGE_SECONDS: ${CATALOG_INDEX_MAX_AGE_SECONDS:-900}
    depends_on:
      semantic-data-catalog-fuseki:
        condition: service_healthy
    networks:
      - solid-dataspace
      - catalog-search

  semantic-data-catalog-fuseki:
    image: son1i/semantic-data-catalog-fuseki:6.2.0
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - semantic_search_data:/fuseki/databases
    networks:
      - catalog-search

  solid-data-connection-sync-worker:
    image: son1i/solid-data-connection-sync-worker:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      WORKER_DB_PATH: /data/participants.sqlite
      WORKER_DB_SECRET: ${SOLID_SYNC_WORKER_DB_SECRET:-}
      WORKER_SYNC_TICK_SECONDS: ${SOLID_SYNC_WORKER_TICK_SECONDS:-600}
      WORKER_REQUEST_TIMEOUT_MS: ${SOLID_SYNC_WORKER_REQUEST_TIMEOUT_MS:-20000}
      WORKER_AUTH_MODE: service
      WORKER_WEBID: ${SOLID_SYNC_WORKER_WEBID:-}
      WORKER_OIDC_ISSUER: ${SOLID_SYNC_WORKER_OIDC_ISSUER:-}
      WORKER_CLIENT_ID: ${SOLID_SYNC_WORKER_CLIENT_ID:-}
      WORKER_CLIENT_SECRET: ${SOLID_SYNC_WORKER_CLIENT_SECRET:-}
      WORKER_ALLOWED_ORIGINS: ${SOLID_SYNC_WORKER_ALLOWED_ORIGINS:-}
      PUBLIC_CACHE_ENABLED: ${PUBLIC_CACHE_ENABLED:-true}
      PUBLIC_CACHE_MONITORING_REFRESH_SECONDS: ${PUBLIC_CACHE_MONITORING_REFRESH_SECONDS:-3600}
      PUBLIC_CACHE_CATALOG_REFRESH_SECONDS: ${PUBLIC_CACHE_CATALOG_REFRESH_SECONDS:-300}
      PUBLIC_CACHE_REFRESH_TIMEOUT_SECONDS: ${PUBLIC_CACHE_REFRESH_TIMEOUT_SECONDS:-120}
      ENVIRONMENTAL_SCENARIO_LEGACY_CONTINUOUS_WEBIDS_JSON: ${CITY_TOURS_LEGACY_CONTINUOUS_WEBIDS_JSON:-[]}
      ENVIRONMENTAL_SCENARIO_ENABLED: ${ENVIRONMENTAL_SCENARIO_ENABLED:-true}
      ENVIRONMENTAL_SCENARIO_POLL_SECONDS: ${ENVIRONMENTAL_SCENARIO_POLL_SECONDS:-30}
      ENVIRONMENTAL_SCENARIO_REGISTRIES_JSON: >-
        ${ENVIRONMENTAL_SCENARIO_REGISTRIES_JSON:-[]}
      ENVIRONMENTAL_SCENARIO_MIN_DONORS_PER_ROUTE: ${ENVIRONMENTAL_SCENARIO_MIN_DONORS_PER_ROUTE:-1}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRIES_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRIES_PER_POLL:-8}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_ENTRIES_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_ENTRIES_PER_POLL:-64}
      ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_MEMBERS_PER_POLL: ${ENVIRONMENTAL_SCENARIO_MAX_REGISTRY_MEMBERS_PER_POLL:-32}
      ENVIRONMENTAL_SCENARIO_DISCOVERY_TIMEOUT_MS: ${ENVIRONMENTAL_SCENARIO_DISCOVERY_TIMEOUT_MS:-25000}
      ENVIRONMENTAL_SCENARIO_OWNER_WEBID: ${ENVIRONMENTAL_SCENARIO_OWNER_WEBID:-https://solid-community-server.tmdt.info/sscon/profile/card#me}
      ENVIRONMENTAL_SCENARIO_MARKER_URL: ${ENVIRONMENTAL_SCENARIO_MARKER_URL:-https://solid-community-server.tmdt.info/sscon/solid-tours/public/current-run.json}
      ENVIRONMENTAL_SCENARIO_DATA_URL_PREFIX: ${ENVIRONMENTAL_SCENARIO_DATA_URL_PREFIX:-https://solid-community-server.tmdt.info/sscon/solid-tours/runs/}
      ENVIRONMENTAL_SCENARIO_MAX_BYTES: ${ENVIRONMENTAL_SCENARIO_MAX_BYTES:-2097152}
      STATISTICS_ENABLED: ${STATISTICS_ENABLED:-false}
      STATISTICS_POD_BASE_URL: ${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}
      STATISTICS_EVENT_SOURCES_JSON: >-
        ${STATISTICS_EVENT_SOURCES_JSON:-[{"id":"test","label":"Test","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/test/downloads/"},{"id":"test2","label":"Test 2","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/test2/downloads/"},{"id":"dace","label":"DACE","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/dace/downloads/"},{"id":"stadt-wuppertal","label":"Stadt Wuppertal","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/stadt-wuppertal/downloads/"},{"id":"timberconnect","label":"TimberConnect","url":"${STATISTICS_POD_BASE_URL:-https://solid-community-server.tmdt.info/solidtestpod/statistics/}events/catalog-instances/timberconnect/downloads/"}]}
      STATISTICS_INCLUDE_LEGACY_EVENT_SOURCE: ${STATISTICS_INCLUDE_LEGACY_EVENT_SOURCE:-true}
      STATISTICS_ADMIN_WEBIDS_JSON: >-
        ${STATISTICS_ADMIN_WEBIDS_JSON:-["https://solid-community-server.tmdt.info/solidtestpod/profile/card#me"]}
      STATISTICS_HMAC_SECRET: ${STATISTICS_HMAC_SECRET:-}
      STATISTICS_HMAC_VERSION: ${STATISTICS_HMAC_VERSION:-v1}
      STATISTICS_REGISTRIES_JSON: >-
        ${STATISTICS_REGISTRIES_JSON:-[{"id":"stadt-wuppertal","label":"Gesundes Tal","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/stadt-wuppertal"},{"id":"dace","label":"DACE","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/dace"},{"id":"timberconnect","label":"TimberConnect","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/timberconnect"},{"id":"test","label":"Test","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/test"},{"id":"test2","label":"Test 2","url":"https://solid-community-server.tmdt.info/semanticdatacatalog/public/test2"}]}
      STATISTICS_REFRESH_INTERVAL_MINUTES: ${STATISTICS_REFRESH_INTERVAL_MINUTES:-15}
      STATISTICS_TIMEZONE: ${STATISTICS_TIMEZONE:-Europe/Berlin}
      STATISTICS_ACTIVITY_RESOURCE_PATH: ${STATISTICS_ACTIVITY_RESOURCE_PATH:-statistics/activity/activity.ttl}
      STATISTICS_RETENTION_MONTHS: ${STATISTICS_RETENTION_MONTHS:-24}
      STATISTICS_RAW_EVENT_RETENTION_DAYS: ${STATISTICS_RAW_EVENT_RETENTION_DAYS:-90}
      STATISTICS_REQUEST_TIMEOUT_MS: ${STATISTICS_REQUEST_TIMEOUT_MS:-20000}
    volumes:
      - solid_data_connection_sync_worker_data:/data
    expose: ["8080"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-solid-data-connection-sync-worker

  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - NR_UI_HOST=0.0.0.0
      - NR_ADMIN_ROOT=/node-red
      - NR_NODE_ROOT=/node-red
    volumes:
      - ./settings.js:/data/settings.js
      - nodered-data:/data
    expose: ["1880", "1883", "1884"]
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-node-red

  caddy:
    image: caddy:2
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      solid-dataspace:
        aliases:
          - solid-dataspace-dev-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      solid-dataspace-manager:
        condition: service_started
        restart: true
      solid-data-manager:
        condition: service_started
        restart: true
      environmental-monitoring:
        condition: service_started
        restart: true
      solid-health-app:
        condition: service_started
        restart: true
      solid-health-questionnaire:
        condition: service_started
        restart: true
      city-tours:
        condition: service_started
        restart: true
      semantic-data-catalog-frontend:
        condition: service_started
        restart: true
      semantic-data-catalog-backend:
        condition: service_started
        restart: true
      solid-data-connection-sync-worker:
        condition: service_started
        restart: true
      node-red:
        condition: service_started
        restart: true

volumes:
  semantic_search_data:
  nodered-data:
  solid_data_connection_sync_worker_data:
networks:
  catalog-search:
    internal: true
  solid-dataspace:
    name: solid-dataspace
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.23.0.0/16
        - subnet: fd00:1234:5678:23::/64
