    - region [ref=f6e285]:
      - generic [ref=f6e286]:
        - generic [ref=f6e287]: End-to-end
        - heading "How data moves through the Dataspace" [level=2] [ref=f6e288]
        - paragraph [ref=f6e289]: Storage, discovery and use are separate decisions. Publishing metadata does not automatically make a protected source readable.
      - list [ref=f6e290]:
        - listitem [ref=f6e291]:
          - generic [ref=f6e292]: "01"
          - generic [ref=f6e293]:
            - heading "Identify and onboard" [level=3] [ref=f6e294]
            - paragraph [ref=f6e295]: Sign in with Solid-OIDC. Your WebID connects the session to your Pod, inbox, catalog and registries.
        - listitem [ref=f6e296]:
          - generic [ref=f6e297]: "02"
          - generic [ref=f6e298]:
            - heading "Store or connect" [level=3] [ref=f6e299]
            - paragraph [ref=f6e300]: Upload resources directly or connect selected external sources such as Home Assistant and custom APIs.
        - listitem [ref=f6e301]:
          - generic [ref=f6e302]: "03"
          - generic [ref=f6e303]:
            - heading "Describe and publish" [level=3] [ref=f6e304]
            - paragraph [ref=f6e305]: Add metadata or semantic models, then explicitly index the resources that should become discoverable.
        - listitem [ref=f6e306]:
          - generic [ref=f6e307]: "04"
          - generic [ref=f6e308]:
            - heading "Request and decide" [level=3] [ref=f6e309]
            - paragraph [ref=f6e310]: Protected data stays protected until its owner approves a purpose-bound access request.
        - listitem [ref=f6e311]:
          - generic [ref=f6e312]: "05"
          - generic [ref=f6e313]:
            - heading "Use and trace" [level=3] [ref=f6e314]
            - paragraph [ref=f6e315]: Applications use approved data while requests, decisions and active connections remain visible in the Manager.
    - region [ref=f6e316]:
      - generic [ref=f6e317]:
        - generic [ref=f6e318]: Data boundaries
        - heading "What stays where" [level=2] [ref=f6e319]
        - paragraph [ref=f6e320]: The project is Pod-first, but it is not accurate to claim that every derived value exists only in a Pod. These are the current processing boundaries.
      - generic [ref=f6e321]:
        - article [ref=f6e322]:
          - img [ref=f6e324]: 
          - generic [ref=f6e326]: Primary storage
          - heading "Personal Pod" [level=3] [ref=f6e327]
          - paragraph [ref=f6e328]: Profiles, application state, questionnaire results, routes and connection settings are stored in the user's Solid Pod according to each app's access policy.
        - article [ref=f6e329]:
          - img [ref=f6e331]: 
          - generic [ref=f6e333]: Explicitly discoverable
          - heading "Catalog & registry" [level=3] [ref=f6e334]
          - paragraph [ref=f6e335]: Only metadata and distributions that a user explicitly indexes are made discoverable. Protected source resources still require permission.
        - article [ref=f6e336]:
          - img [ref=f6e338]: 
          - generic [ref=f6e340]: Integration state
          - heading "Browser & source providers" [level=3] [ref=f6e341]
          - paragraph [ref=f6e342]: Some integrations keep tokens or interface selections in browser storage and contact configured sources such as Google Fit, Home Assistant, custom APIs or Open-Meteo.
        - article [ref=f6e343]:
          - img [ref=f6e345]: 
          - generic [ref=f6e347]: Transparent processing
          - heading "Purpose-bound services" [level=3] [ref=f6e348]
          - paragraph [ref=f6e349]: The sync worker keeps operational state, PLASMA and Node-RED use service storage, movement donations are aggregated, and chatbot embeddings are kept in per-WebID Qdrant indexes.
      - complementary [ref=f6e350]:
        - generic [ref=f6e353]:
          - strong [ref=f6e354]: Access is contextual, not global
          - paragraph [ref=f6e355]: Solid-OIDC authenticates the session. WAC permissions determine whether that authenticated agent may access a specific Pod resource.
      - generic [ref=f6e356]:
        - generic [ref=f6e357]:
          - generic [ref=f6e358]: Current scope
          - heading "Implemented today, with clear boundaries" [level=3] [ref=f6e359]
        - list [ref=f6e360]:
          - listitem [ref=f6e361]: Embedded applications reuse the Manager's authenticated Solid session. Several applications also provide a standalone build with their own sign-in.
          - listitem [ref=f6e362]: Solid Tours draws and imports routes, but it does not record live GPS tracks or call a routing service.
          - listitem [ref=f6e363]: The Health Questionnaire is an orientation tool. Its score thresholds are product assumptions, not clinically validated cutoffs.
          - listitem [ref=f6e364]: Chatbot processing uses Ollama, Qdrant and a configured Qwen/vLLM endpoint. Server-side indexing currently works reliably for anonymously readable sources.
    - region [ref=f6e365]:
      - generic [ref=f6e366]:
        - generic [ref=f6e367]: Solid in plain language
        - heading "Key terms" [level=2] [ref=f6e368]
        - paragraph [ref=f6e369]: The concepts used throughout this workspace, without protocol jargon.
      - generic [ref=f6e370]:
        - generic [ref=f6e371]:
          - term [ref=f6e372]: Pod
          - definition [ref=f6e373]: A personal web data store made of addressable resources and containers. The owner controls access.
        - generic [ref=f6e374]:
          - term [ref=f6e375]: Web ID
          - definition [ref=f6e376]: A dereferenceable web address that identifies a person or service across Solid applications.
        - generic [ref=f6e377]:
          - term [ref=f6e378]: Solid-OIDC
          - definition [ref=f6e379]: The sign-in protocol that authenticates a Solid session and links it to a WebID.
        - generic [ref=f6e380]:
          - term [ref=f6e381]: WAC
          - definition [ref=f6e382]: Web Access Control rules define which agents may read, append, write or control a Pod resource.
        - generic [ref=f6e383]:
          - term [ref=f6e384]: Inbox
          - definition [ref=f6e385]: The Pod location used to receive access requests, decisions and other linked-data notifications.
        - generic [ref=f6e386]:
          - term [ref=f6e387]: Catalog & registry
          - definition [ref=f6e388]: The catalog describes published datasets; registries make participating Pods and catalogs discoverable.