    - region [ref=f5e285]:
      - generic [ref=f5e286]:
        - generic [ref=f5e287]: End-to-end
        - heading "How data moves through the Dataspace" [level=2] [ref=f5e288]
        - paragraph [ref=f5e289]: Storage, discovery and use are separate decisions. Publishing metadata does not automatically make a protected source readable.
      - list [ref=f5e290]:
        - listitem [ref=f5e291]:
          - generic [ref=f5e292]: "01"
          - generic [ref=f5e293]:
            - heading "Identify and onboard" [level=3] [ref=f5e294]
            - paragraph [ref=f5e295]: Sign in with Solid-OIDC. Your WebID connects the session to your Pod, inbox, catalog and registries.
        - listitem [ref=f5e296]:
          - generic [ref=f5e297]: "02"
          - generic [ref=f5e298]:
            - heading "Store or connect" [level=3] [ref=f5e299]
            - paragraph [ref=f5e300]: Upload resources directly or connect selected external sources such as Home Assistant and custom APIs.
        - listitem [ref=f5e301]:
          - generic [ref=f5e302]: "03"
          - generic [ref=f5e303]:
            - heading "Describe and publish" [level=3] [ref=f5e304]
            - paragraph [ref=f5e305]: Add metadata or semantic models, then explicitly index the resources that should become discoverable.
        - listitem [ref=f5e306]:
          - generic [ref=f5e307]: "04"
          - generic [ref=f5e308]:
            - heading "Request and decide" [level=3] [ref=f5e309]
            - paragraph [ref=f5e310]: Protected data stays protected until its owner approves a purpose-bound access request.
        - listitem [ref=f5e311]:
          - generic [ref=f5e312]: "05"
          - generic [ref=f5e313]:
            - heading "Use and trace" [level=3] [ref=f5e314]
            - paragraph [ref=f5e315]: Applications use approved data while requests, decisions and active connections remain visible in the Manager.
    - region [ref=f5e316]:
      - generic [ref=f5e317]:
        - generic [ref=f5e318]: Data boundaries
        - heading "What stays where" [level=2] [ref=f5e319]
        - paragraph [ref=f5e320]: The project is Pod-first, but it is not accurate to claim that every derived value exists only in a Pod. These are the current processing boundaries.
      - generic [ref=f5e321]:
        - article [ref=f5e322]:
          - img [ref=f5e324]: 
          - generic [ref=f5e326]: Primary storage
          - heading "Personal Pod" [level=3] [ref=f5e327]
          - paragraph [ref=f5e328]: Profiles, application state, questionnaire results, routes and connection settings are stored in the user's Solid Pod according to each app's access policy.
        - article [ref=f5e329]:
          - img [ref=f5e331]: 
          - generic [ref=f5e333]: Explicitly discoverable
          - heading "Catalog & registry" [level=3] [ref=f5e334]
          - paragraph [ref=f5e335]: Only metadata and distributions that a user explicitly indexes are made discoverable. Protected source resources still require permission.
        - article [ref=f5e336]:
          - img [ref=f5e338]: 
          - generic [ref=f5e340]: Integration state
          - heading "Browser & source providers" [level=3] [ref=f5e341]
          - paragraph [ref=f5e342]: Some integrations keep tokens or interface selections in browser storage and contact configured sources such as Google Fit, Home Assistant, custom APIs or Open-Meteo.
        - article [ref=f5e343]:
          - img [ref=f5e345]: 
          - generic [ref=f5e347]: Transparent processing
          - heading "Purpose-bound services" [level=3] [ref=f5e348]
          - paragraph [ref=f5e349]: The sync worker keeps operational state, PLASMA and Node-RED use service storage, movement donations are aggregated, and chatbot embeddings are kept in per-WebID Qdrant indexes.
      - complementary [ref=f5e350]:
        - generic [ref=f5e353]:
          - strong [ref=f5e354]: Access is contextual, not global
          - paragraph [ref=f5e355]: Solid-OIDC authenticates the session. WAC permissions determine whether that authenticated agent may access a specific Pod resource.
      - generic [ref=f5e356]:
        - generic [ref=f5e357]:
          - generic [ref=f5e358]: Current scope
          - heading "Implemented today, with clear boundaries" [level=3] [ref=f5e359]
        - list [ref=f5e360]:
          - listitem [ref=f5e361]: Embedded applications reuse the Manager's authenticated Solid session. Several applications also provide a standalone build with their own sign-in.
          - listitem [ref=f5e362]: Solid Tours draws and imports routes, but it does not record live GPS tracks or call a routing service.
          - listitem [ref=f5e363]: The Health Questionnaire is an orientation tool. Its score thresholds are product assumptions, not clinically validated cutoffs.
          - listitem [ref=f5e364]: Chatbot processing uses Ollama, Qdrant and a configured Qwen/vLLM endpoint. Server-side indexing currently works reliably for anonymously readable sources.
    - region [ref=f5e365]:
      - generic [ref=f5e366]:
        - generic [ref=f5e367]: Solid in plain language
        - heading "Key terms" [level=2] [ref=f5e368]
        - paragraph [ref=f5e369]: The concepts used throughout this workspace, without protocol jargon.
      - generic [ref=f5e370]:
        - generic [ref=f5e371]:
          - term [ref=f5e372]: Pod
          - definition [ref=f5e373]: A personal web data store made of addressable resources and containers. The owner controls access.
        - generic [ref=f5e374]:
          - term [ref=f5e375]: Web ID
          - definition [ref=f5e376]: A dereferenceable web address that identifies a person or service across Solid applications.
        - generic [ref=f5e377]:
          - term [ref=f5e378]: Solid-OIDC
          - definition [ref=f5e379]: The sign-in protocol that authenticates a Solid session and links it to a WebID.
        - generic [ref=f5e380]:
          - term [ref=f5e381]: WAC
          - definition [ref=f5e382]: Web Access Control rules define which agents may read, append, write or control a Pod resource.
        - generic [ref=f5e383]:
          - term [ref=f5e384]: Inbox
          - definition [ref=f5e385]: The Pod location used to receive access requests, decisions and other linked-data notifications.
        - generic [ref=f5e386]:
          - term [ref=f5e387]: Catalog & registry
          - definition [ref=f5e388]: The catalog describes published datasets; registries make participating Pods and catalogs discoverable.