    - region [ref=f7e285]:
      - generic [ref=f7e286]:
        - generic [ref=f7e287]: Durchgängig
        - heading "So bewegen sich Daten durch den Dataspace" [level=2] [ref=f7e288]
        - paragraph [ref=f7e289]: Speicherung, Auffindbarkeit und Nutzung sind getrennte Entscheidungen. Das Veröffentlichen von Metadaten macht eine geschützte Quelle nicht automatisch lesbar.
      - list [ref=f7e290]:
        - listitem [ref=f7e291]:
          - generic [ref=f7e292]: "01"
          - generic [ref=f7e293]:
            - heading "Identifizieren und einrichten" [level=3] [ref=f7e294]
            - paragraph [ref=f7e295]: Melde dich mit Solid-OIDC an. Deine WebID verbindet die Sitzung mit deinem Pod, deiner Inbox, deinem Katalog und deinen Registries.
        - listitem [ref=f7e296]:
          - generic [ref=f7e297]: "02"
          - generic [ref=f7e298]:
            - heading "Speichern oder verbinden" [level=3] [ref=f7e299]
            - paragraph [ref=f7e300]: Lade Ressourcen direkt hoch oder verbinde ausgewählte externe Quellen wie Home Assistant und eigene APIs.
        - listitem [ref=f7e301]:
          - generic [ref=f7e302]: "03"
          - generic [ref=f7e303]:
            - heading "Beschreiben und veröffentlichen" [level=3] [ref=f7e304]
            - paragraph [ref=f7e305]: Ergänze Metadaten oder semantische Modelle und indexiere anschließend ausdrücklich die Ressourcen, die auffindbar werden sollen.
        - listitem [ref=f7e306]:
          - generic [ref=f7e307]: "04"
          - generic [ref=f7e308]:
            - heading "Anfragen und entscheiden" [level=3] [ref=f7e309]
            - paragraph [ref=f7e310]: Geschützte Daten bleiben geschützt, bis ihr Eigentümer eine zweckgebundene Zugriffsanfrage genehmigt.
        - listitem [ref=f7e311]:
          - generic [ref=f7e312]: "05"
          - generic [ref=f7e313]:
            - heading "Nutzen und nachvollziehen" [level=3] [ref=f7e314]
            - paragraph [ref=f7e315]: Anwendungen nutzen freigegebene Daten, während Anfragen, Entscheidungen und aktive Verbindungen im Manager sichtbar bleiben.
    - region [ref=f7e316]:
      - generic [ref=f7e317]:
        - generic [ref=f7e318]: Datengrenzen
        - heading "Was wo gespeichert und verarbeitet wird" [level=2] [ref=f7e319]
        - paragraph [ref=f7e320]: Das Projekt setzt den Pod an erste Stelle. Dennoch wäre es nicht korrekt zu behaupten, dass jeder abgeleitete Wert ausschließlich in einem Pod existiert. Dies sind die aktuellen Verarbeitungsgrenzen.
      - generic [ref=f7e321]:
        - article [ref=f7e322]:
          - img [ref=f7e324]: 
          - generic [ref=f7e326]: Primärer Speicher
          - heading "Persönlicher Pod" [level=3] [ref=f7e327]
          - paragraph [ref=f7e328]: Profile, Anwendungszustände, Fragebogenergebnisse, Routen und Verbindungseinstellungen werden gemäß der Zugriffsrichtlinie der jeweiligen App im Solid-Pod des Nutzers gespeichert.
        - article [ref=f7e329]:
          - img [ref=f7e331]: 
          - generic [ref=f7e333]: Ausdrücklich auffindbar
          - heading "Katalog und Registry" [level=3] [ref=f7e334]
          - paragraph [ref=f7e335]: Nur Metadaten und Distributionen, die ein Nutzer ausdrücklich indexiert, werden auffindbar. Geschützte Quellressourcen benötigen weiterhin eine Berechtigung.
        - article [ref=f7e336]:
          - img [ref=f7e338]: 
          - generic [ref=f7e340]: Integrationszustand
          - heading "Browser und Quellanbieter" [level=3] [ref=f7e341]
          - paragraph [ref=f7e342]: Einige Integrationen speichern Token oder Oberflächenauswahlen im Browser und kontaktieren konfigurierte Quellen wie Google Fit, Home Assistant, eigene APIs oder Open-Meteo.
        - article [ref=f7e343]:
          - img [ref=f7e345]: 
          - generic [ref=f7e347]: Transparente Verarbeitung
          - heading "Zweckgebundene Dienste" [level=3] [ref=f7e348]
          - paragraph [ref=f7e349]: Der Sync-Worker verwaltet Betriebszustände, PLASMA und Node-RED nutzen eigenen Dienstspeicher, Bewegungsspenden werden aggregiert und Chatbot-Embeddings liegen in nach WebID getrennten Qdrant-Indizes.
      - complementary [ref=f7e350]:
        - generic [ref=f7e353]:
          - strong [ref=f7e354]: Zugriff gilt kontextbezogen, nicht global
          - paragraph [ref=f7e355]: Solid-OIDC authentifiziert die Sitzung. WAC-Berechtigungen bestimmen, ob dieser authentifizierte Akteur auf eine bestimmte Pod-Ressource zugreifen darf.
      - generic [ref=f7e356]:
        - generic [ref=f7e357]:
          - generic [ref=f7e358]: Aktueller Umfang
          - heading "Heute umgesetzt – mit klaren Grenzen" [level=3] [ref=f7e359]
        - list [ref=f7e360]:
          - listitem [ref=f7e361]: Eingebettete Anwendungen verwenden die authentifizierte Solid-Sitzung des Managers. Mehrere Anwendungen bieten zusätzlich eine Standalone-Variante mit eigener Anmeldung.
          - listitem [ref=f7e362]: Solid Tours zeichnet und importiert Routen, erfasst jedoch keine Live-GPS-Spuren und ruft keinen Routingdienst auf.
          - listitem [ref=f7e363]: Der Health Questionnaire dient zur Orientierung. Seine Bewertungsgrenzen sind Produktannahmen und keine klinisch validierten Grenzwerte.
          - listitem [ref=f7e364]: Die Chatbot-Verarbeitung nutzt Ollama, Qdrant und einen konfigurierten Qwen-/vLLM-Endpunkt. Die serverseitige Indexierung funktioniert derzeit zuverlässig für anonym lesbare Quellen.
    - region [ref=f7e365]:
      - generic [ref=f7e366]:
        - generic [ref=f7e367]: Solid einfach erklärt
        - heading "Wichtige Begriffe" [level=2] [ref=f7e368]
        - paragraph [ref=f7e369]: Die in diesem Arbeitsbereich verwendeten Begriffe – ohne Protokolljargon.
      - generic [ref=f7e370]:
        - generic [ref=f7e371]:
          - term [ref=f7e372]: Pod
          - definition [ref=f7e373]: Ein persönlicher Web-Datenspeicher aus adressierbaren Ressourcen und Containern. Der Eigentümer steuert den Zugriff.
        - generic [ref=f7e374]:
          - term [ref=f7e375]: WebID
          - definition [ref=f7e376]: Eine auflösbare Webadresse, die eine Person oder einen Dienst über Solid-Anwendungen hinweg identifiziert.
        - generic [ref=f7e377]:
          - term [ref=f7e378]: Solid-OIDC
          - definition [ref=f7e379]: Das Anmeldeprotokoll, das eine Solid-Sitzung authentifiziert und mit einer WebID verknüpft.
        - generic [ref=f7e380]:
          - term [ref=f7e381]: WAC
          - definition [ref=f7e382]: Web-Access-Control-Regeln legen fest, welche Akteure eine Pod-Ressource lesen, ergänzen, schreiben oder kontrollieren dürfen.
        - generic [ref=f7e383]:
          - term [ref=f7e384]: Eingang
          - definition [ref=f7e385]: Der Pod-Speicherort für Zugriffsanfragen, Entscheidungen und andere Linked-Data-Benachrichtigungen.
        - generic [ref=f7e386]:
          - term [ref=f7e387]: Katalog und Registry
          - definition [ref=f7e388]: Der Katalog beschreibt veröffentlichte Datensätze; Registries machen teilnehmende Pods und Kataloge auffindbar.